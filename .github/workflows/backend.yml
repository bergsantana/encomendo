name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/postgres/**"
      - "deploy/api.Dockerfile"
      - "deploy/docker-compose.yml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/postgres/**"
      - "deploy/api.Dockerfile"
      - "deploy/docker-compose.yml"
      - ".github/workflows/backend.yml"
  schedule:
    - cron: "17 6 * * *" # nightly e2e (03:17 in Manaus)

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Unit tests (race, shuffled)
        run: go test -race -shuffle=on -count=1 -coverpkg=./internal/... -coverprofile=unit.out ./internal/... ./cmd/...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: backend/unit.out

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Integration tests (testcontainers)
        run: go test -race -count=1 -tags integration -coverpkg=./internal/... -coverprofile=integration.out ./test/integration/...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: backend/integration.out

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start Postgres with the real init script
        working-directory: .
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait postgres
      - name: Up, reset, up
        env:
          MIGRATE_DATABASE_URL: postgres://encomendo_owner:encomendo_owner_dev@localhost:5432/encomendo?sslmode=disable
          LOG_FORMAT: text
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate reset
          go run ./cmd/migrate up
          go run ./cmd/migrate status

  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: backend/coverage
          merge-multiple: true
      - name: Coverage gate (90% domain + app, 80% overall)
        run: ./scripts/coverage-gate.sh coverage/unit.out coverage/integration.out

  build:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start the stack
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build --wait postgres redis api
      - name: E2E smoke
        run: |
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8081/readyz
          if [ -d test/e2e ]; then go test -count=1 -tags e2e ./test/e2e/...; fi
      - name: API logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f deploy/docker-compose.yml logs api migrate
