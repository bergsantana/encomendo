name: security

# CodeQL and dependency review are not here: on a private repository they need
# GitHub Advanced Security (docs/adr/0008-no-ghas.md). Dependabot covers
# dependency alerts and govulncheck covers Go.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1" # weekly, Monday

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
