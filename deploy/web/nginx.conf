# Local stack: admin.localhost serves the admin app; any other host serves
# the store app, which reads the tenant slug from the host
# (altarpm.localhost locally, altarpm.encomendo.com.br in production).
# API paths go to the api service on the same origin, so no CORS is needed.

server {
  listen 8080;
  server_name admin.localhost;
  root /usr/share/nginx/admin;

  location ~ ^/(api|auth|healthz|readyz)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/store;

  location ~ ^/(api|auth|healthz|readyz)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
