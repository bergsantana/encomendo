        "A comprar", which can be received as bought at the counter. Carries
        no cost.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: What can be received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToReceive"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/receipt-photo-uploads:
    post:
      tags: [purchasing]
      operationId: requestReceiptPhotoUpload
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: Get a short-lived URL to upload one receiving photo (item or invoice).
      description: |
        Needs `receiving:write`. As catalog photo uploads (ADR 0024, ADR
        0028): the server picks the key, the app uploads with `method` to
        `uploadUrl` sending exactly `headers`, then names the key in the
        receipt. An upload never named in a receipt is removed after a day.
        Limited like catalog uploads (ADR 0021).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptPhotoUploadRequest"
      responses:
        "201":
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/receipts:
    post:
      tags: [purchasing]
      operationId: recordReceipt
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: Save a receipt ("Salvar recebimento").
      description: |
        Needs `receiving:write`. Each entry names an open line (`lineId`) or
        an item still in "A comprar" bought at the counter (`orderItemId`),
        with its check. A line is received whole (ADR 0031). `defective`
        needs `note`. Photos are optional: up to 2 per entry and 4 invoice
        photos, each a key from `receipt-photo-uploads`. `ok` moves the item
        to `received`; `defective` moves it back to `to_buy`, where it shows
        again in "A comprar" as "Reposição". A replay with the same
        `Idempotency-Key` answers the same receipt.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptRequest"
      responses:
        "201":
          description: The receipt and what it completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          $ref: "#/components/responses/PhotoRefused"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PurchaseConflict"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/notices:
    get:
      tags: [purchasing]
      operationId: listPurchaseNotices
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: '"Avisar o fornecedor" — sent lines no longer needed.'
      description: |
        Needs `purchase:write`. An open line whose order was cancelled,
        whose item was removed from the order, or whose item's quantity or
        choices changed after it was sent (ADR 0031). Each carries a `wa.me`
        link asking the supplier to cancel; its text never names the client.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The notices, oldest send first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/notices/{lineId}/resolve:
    post:
      tags: [purchasing]
      operationId: resolvePurchaseNotice
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: Mark a notice as resolved ("Marcar como resolvido").
      description: |
        Needs `purchase:write`. Cancels the line. A line that is no longer a
        notice is `409 line_closed`. An item whose quantity or choices
        changed goes back to `to_buy`, so it is bought again as it is now.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PurchaseLineId"
      responses:
        "204":
          description: Resolved.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PurchaseConflict"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/orders/{orderId}/lines:
    get:
      tags: [purchasing]
      operationId: getOrderPurchases
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: What purchasing knows of one order's bought items.
      description: |
        Needs `order:read`. One entry per bought item of the order: its
        open or last line, pedido de compra and promised date.
        `supplierChatUrl` ("Falar com o fornecedor") is only for
        `purchase:write`, and its text names the pedido de compra and the
        item, never the client (ADR 0031).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order's purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPurchases"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/purchasing/today:
    get:
      tags: [purchasing, today]
      operationId: getPurchasingToday
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: Hoje's purchasing entries.
      description: |
        Needs `purchase:write`; the admin calls it beside `getToday` only
        for roles that have it. Items to send per supplier, pedidos de
        compra sent more than 2 days ago with no promised date, and notices.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingToday"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/suppliers/{supplierId}/items:
    get:
      tags: [suppliers]
      operationId: listSupplierItems
      x-unserved: "step 5.10 of docs/plans/m5-purchasing-receiving.md"
      summary: The catalog items a supplier supplies, as main or backup.
      description: |
        Needs `catalog:read`. For the Fornecedores tab of Compras. Archived
        items are left out. `cost` is the owner's only (ADR 0025).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierItemUseList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from an `AuthSession`, audience `backoffice`. Client
        account tokens are rejected on these routes with 401.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-encomendo_refresh
      description: |
        Web only. HttpOnly; Secure; SameSite=Strict; Path=/; host-only; 30
        days. Named `encomendo_refresh`, without Secure, on a local stack over
        plain HTTP.

  headers:
    SetRefreshCookie:
      description: The refresh cookie with the new token, when the refresh transport is `cookie`.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds until the limit resets. Sent on every 429.
      required: true
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: Always `Bearer`.
      schema:
        type: string

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque position from the previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    KitId:
      name: kitId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Search:
      name: q
      in: query
      description: Only rows whose name contains this text, ignoring case.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CategoryFilter:
      name: categoryId
      in: query
      description: Only items of this category.
      schema:
        $ref: "#/components/schemas/Uuid"
    IncludeArchived:
      name: includeArchived
      in: query
      description: Also list archived rows ("Mostrar arquivados").
      schema:
        type: boolean
        default: false
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    OrderItemId:
      name: itemId
      in: path
      required: true
      description: An item of the order (`Order.items[].id`), not a catalog item.
      schema:
        $ref: "#/components/schemas/Uuid"
    SupplierOrderId:
      name: supplierOrderId
      in: path
      required: true
      description: A pedido de compra.
      schema:
        $ref: "#/components/schemas/Uuid"
    PurchaseLineId:
      name: lineId
      in: path
      required: true
      description: A purchase line (`PurchaseLine.id`).
      schema:
        $ref: "#/components/schemas/Uuid"
    SupplierOrderStateFilter:
      name: state
      in: query
      description: "`open` (the default): sent or in transit. `all`: every pedido de compra."
      schema:
        type: string
        enum: [open, all]
        default: open
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        One key per user action, kept for that action's retries (a UUID is
        fine). Missing: `400 idempotency_key_required`. Kept 24 hours (ADR
        0030).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]+$"
    OrderStatusFilter:
      name: status
      in: query
      description: Only orders in this status of their workflow.
      schema:
        $ref: "#/components/schemas/StatusKey"
    PhaseFilter:
      name: phase
      in: query
      description: Only orders in this phase.
      schema:
        $ref: "#/components/schemas/Phase"
    OrderScope:
      name: scope
      in: query
      description: "`active`: neither handed over nor cancelled."
      schema:
        type: string
        enum: [active, handed_over, cancelled, all]
        default: active
    CustomerFilter:
      name: customerId
      in: query
      description: Only this customer's orders.
      schema:
        $ref: "#/components/schemas/Uuid"
    OrderSearch:
      name: q
      in: query
      description: An order number (`231` or `P-0231`) or the start of the customer's name, ignoring case.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AlertFilter:
      name: alert
      in: query
      description: Only active orders with an alert today ("Pode atrasar" or "Atrasada").
      schema:
        type: boolean
        default: false
    PeriodFrom:
      name: from
      in: query
      required: true
      description: First day of the period, in the store's time zone.
      schema:
        $ref: "#/components/schemas/CivilDate"
    PeriodTo:
      name: to
      in: query
      required: true
      description: Last day of the period, included.
      schema:
        $ref: "#/components/schemas/CivilDate"

  responses:
    AuthSession:
      description: A new session.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthSession"
    Invalid:
      description: "`invalid`: the input breaks a rule; `errors` lists the fields."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOrigin:
      description: |
        `forbidden`: a browser call from another origin, or whose
        `Sec-Fetch-Site` is not `same-origin` (ADR 0010). Native clients,
        which send neither header, never get it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerFailure:
      description: |
        `internal`: the server failed. `not_ready`: a dependency is down or
        busy, such as every password-hashing slot taken; wait `Retry-After`
        seconds. Never a 401: keep the session and try again (ADR 0013).
      headers:
        Retry-After:
          description: With `503 not_ready`, whole seconds to wait.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: "`unauthenticated`: no token, or an expired, tampered or wrong-audience one. Refresh once, then log in."
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        `forbidden`: the role lacks the permission. `tenant_required`: the
        session has no store selected; open the store picker.
        `tenant_suspended`: the store is suspended; show its message and
        open the store picker (ADR 0022).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`: no such thing in this store."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VersionConflict:
      description: "`version_conflict`: someone saved first. Reload and apply the change again."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited`: too many attempts. Wait `Retry-After` seconds."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NameTaken:
      description: "`name_taken`: another row of this kind already has this name, ignoring case."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ItemArchived:
      description: "`item_archived`: an item in the kit, or one of its alternatives, is archived; `references` names them."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PhotoRefused:
      description: |
        `photo_invalid`: the stored object is over 10 MB or not a JPEG, PNG
        or WebP image; it was deleted. `photo_not_uploaded`: nothing was
        uploaded to the key, or the key is not one issued for this item or
        kit in this store (the two are not told apart). `invalid`: the body
        breaks a rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PhotoLimit:
      description: "`photo_limit`: the item or kit already has 8 photos."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    WorkflowNotFound:
      description: "`workflow_not_found`: no preset has this id and version."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CustomerConflict:
      description: |
        `phone_taken`: another customer of the store has this WhatsApp
        number. `version_conflict`: someone saved first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OrderInvalid:
      description: |
        `invalid`: the input breaks a rule; `errors` lists the fields.
        `approval_required`: the order was paid, so the change needs
        `customerApproved: true`. `payment_exceeds_due`: the amount is above
        what is still due. `idempotency_key_required`: the
        `Idempotency-Key` header is missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OrderConflict:
      description: |
        The order's state refuses the call:

        - `version_conflict`: someone saved first; reload.
        - `conflict`: the same `Idempotency-Key` is still being handled; try
          again.
        - `invalid_transition`: the status is not one of the order's `moves`.
        - `guard_failed`: a phase the move enters is not ready; `guard` says
          which (`deposit_unpaid`, `items_not_ready`, `balance_unpaid`).
        - `order_not_editable`: the order is in assembling or later.
        - `order_closed`: the order was handed over or cancelled.
        - `invalid_item_move`: the item cannot go to that state.
        - `no_backup_supplier`: the item has no backup supplier, or was
          already bought.
        - `item_unavailable`: an item or kit of the order is archived;
          `references` names it.
        - `item_moved_by_purchasing`: a bought item moves through Compras and
          Receber itens; on the order only `received → installed` (ADR 0031).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PurchaseConflict:
      description: |
        The purchase's state refuses the call:

        - `version_conflict`: someone saved first; reload.
        - `conflict`: the same `Idempotency-Key` is still being handled; try
          again.
        - `item_not_to_buy`: an item is no longer in "A comprar" for this
          supplier (sent by someone else, removed, or its order cancelled).
        - `supplier_order_received`: something on it was already received.
        - `line_closed`: the line was already received, found defective or
          cancelled, or is no longer a notice.
        - `order_closed`: an order of the call was handed over or cancelled.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyKeyReused:
      description: "`idempotency_key_reused`: this key was already used for a different request. Make a new key for a new action."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok]
    Problem:
      type: object
      description: RFC 9457 problem details. Branch on `code`, never on `title`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          description: Short pt-BR summary.
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable code. New codes may be added; existing ones never change.
          enum:
            - invalid
            - not_found
            - method_not_allowed
            - conflict
            - forbidden
            - internal
            - not_ready
            - unauthenticated
            - invalid_credentials
            - tenant_required
            - version_conflict
            - rate_limited
            - email_taken
            - slug_taken
            - already_member
            - invalid_code
            - email_unavailable
            - tenant_suspended
            - name_taken
            - category_in_use
            - item_in_kit
            - item_archived
            - photo_limit
            - photo_invalid
            - photo_not_uploaded
            - invalid_transition
            - guard_failed
            - order_not_editable
            - order_closed
            - approval_required
            - payment_exceeds_due
            - invalid_item_move
            - no_backup_supplier
            - item_unavailable
            - phone_taken
            - workflow_not_found
            - idempotency_key_required
            - idempotency_key_reused
            - item_moved_by_purchasing
            - item_not_to_buy
            - supplier_order_received
            - line_closed
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"
        references:
          type: array
          description: |
            With `item_in_kit` and `item_archived`, the rows the refusal
            names (the kits, or the archived items). With
            `item_unavailable`, the archived items or kits of the order.
          items:
            $ref: "#/components/schemas/Reference"
        guard:
          type: string
          enum: [deposit_unpaid, items_not_ready, balance_unpaid]
          description: With `guard_failed` only, the guard that did not hold.
    FieldIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            The path of the invalid value in the request body: property
            names joined by dots, with zero-based indexes in brackets, for
            example `mainSupplier.leadDays` or `options[0].choices[1].label`.
        message:
          type: string
          description: pt-BR text the client may show next to the field.

    Uuid:
      type: string
      format: uuid
      example: 0190f3c4-5e1a-7b2c-8d3e-4f5a6b7c8d9e
    Email:
      type: string
      format: email
      maxLength: 254
      description: Compared without regard to case.
      example: dono@altarpm.com.br
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ana Souza
    Password:
      type: string
      writeOnly: true
      minLength: 8
      maxLength: 128
      description: 8 to 128 characters. Stored only as an argon2id hash.
    Slug:
      type: string
      minLength: 3
      maxLength: 40
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: |
        The store's address label: `{slug}.encomendo.com.br`. Lower-case
        letters, digits and single hyphens. Reserved, and answered with
        `invalid`: the labels of the configured admin and API hosts, plus
        www, api, admin, app, conta, mail and static (the list the store app
        uses in web/apps/store/src/site.ts).
      example: altarpm
    Role:
      type: string
      enum: [owner, admin, staff, viewer]
      description: A staff member's role in one store (docs/architecture.md section 5.4).
    InvitableRole:
      type: string
      enum: [admin, staff, viewer]
      description: Any role but owner; a store has one owner.
    Permission:
      type: string
      enum:
        - catalog:read
        - catalog:write
        - customer:write
        - finance:read
        - inventory:adjust
        - members:manage
        - order:manage
        - order:override
        - order:read
        - order:write
        - portal:write
        - production:write
        - purchase:write
        - receiving:write
        - settings:read
        - settings:write
      description: New permissions are added as features land; existing ones never change.
    RefreshTransport:
      type: string
      enum: [cookie, body]
      default: cookie
      description: How the refresh token travels; see "Sessions" above. Android sends `body`.

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
    TenantSummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Alta RPM
        slug:
          $ref: "#/components/schemas/Slug"
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantSummary"
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    Membership:
      type: object
      required: [tenant, role, status]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [active, suspended]
          description: |
            `suspended`: the platform suspended the store. The picker shows
            it, marked "Suspensa", and cannot enter it (ADR 0022).
    Session:
      type: object
      required: [user, permissions, memberships]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
          description: The selected store. Absent when none is selected.
        role:
          $ref: "#/components/schemas/Role"
          description: The role in the selected store. Absent when none is selected.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: What the role allows in the selected store; empty when none is selected.
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
          description: Every store the user belongs to, for the store picker.
    AuthSession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [accessToken, tokenType, expiresIn]
          properties:
            accessToken:
              type: string
              description: JWT (EdDSA). Do not parse it; read the session fields instead.
            tokenType:
              type: string
              enum: [Bearer]
            expiresIn:
              type: integer
              description: Seconds until the access token expires (900).
              example: 900
            refreshToken:
              type: string
              description: Only with the `body` refresh transport.

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          writeOnly: true
          maxLength: 128
        tenantId:
          $ref: "#/components/schemas/Uuid"
          description: The store to select, such as the one used last on this device.
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Android only. The web app sends `{}` and the cookie.
    SwitchTenantRequest:
      type: object
      additionalProperties: false
      required: [tenantId]
      properties:
        tenantId:
          $ref: "#/components/schemas/Uuid"
        refreshToken:
          type: string
          description: Android only.
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Android only.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "482913"
        password:
          $ref: "#/components/schemas/Password"

    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          description: From the invitation link.
    InvitationPreview:
      type: object
      required: [tenant, email, role, accountExists, expiresAt]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
        accountExists:
          type: boolean
          description: True when the email already has an account; ask for its password instead of a name and a new one.
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 128
        name:
          $ref: "#/components/schemas/PersonName"
          description: Required when the email has no account yet; ignored otherwise.
        password:
          type: string
          writeOnly: true
          maxLength: 128
          description: The new password (8 to 128 characters) for a new account, or the existing account's password.
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The store's name as clients see it.
          example: Alta RPM
        slug:
          $ref: "#/components/schemas/Slug"
    StatusWorkflowRef:
      type: object
      required: [id, version, name, statuses]
      description: The status workflow new orders take (ADR 0004). Chosen in settings from milestone 4.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        version:
          type: integer
          minimum: 1
        name:
          type: string
          description: pt-BR name of the preset.
          example: Encomenda com montagem
        statuses:
          type: array
          description: |
            The workflow's statuses in order, for the settings screen's
            preview. Always present (served since step 4.8).
          items:
            $ref: "#/components/schemas/OrderStatus"
    WhatsappPhone:
      type: [string, "null"]
      pattern: "^55[1-9]{2}[0-9]{8,9}$"
      description: |
        The store's WhatsApp number, digits only with country and area code
        (55 + DDD + number), as wa.me links need it. Null when not set.
      example: "5592991234567"
    EditableSettings:
      type: object
      required:
        - stockEnabled
        - productionEnabled
        - purchaseBeforeDeposit
        - depositPercent
        - assemblyDays
        - safetyMarginDays
        - whatsappPhone
      properties:
        stockEnabled:
          type: boolean
          description: Estoque menu and the `stock` sourcing mode.
        productionEnabled:
          type: boolean
          description: Produção menu and the `in_house` sourcing mode.
        purchaseBeforeDeposit:
          type: boolean
          description: Generate purchases before the deposit ("Sinal") is paid. Off by default.
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
        assemblyDays:
          type: integer
          minimum: 0
          maximum: 365
          example: 3
        safetyMarginDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Margem de segurança.
          example: 2
        whatsappPhone:
          $ref: "#/components/schemas/WhatsappPhone"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
    TenantSettings:
      allOf:
        - $ref: "#/components/schemas/EditableSettings"
        - type: object
          required: [currency, statusWorkflow, version, timeZone]
          properties:
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
              readOnly: true
              example: BRL
            statusWorkflow:
              $ref: "#/components/schemas/StatusWorkflowRef"
            version:
              type: integer
              minimum: 1
              description: Send it back on update; a stale one answers `version_conflict`.
    UpdateSettingsRequest:
      allOf:
        - $ref: "#/components/schemas/EditableSettings"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    Member:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          type: string
          description: Absent on the last page.
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/InvitableRole"
    InviteMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
    Invitation:
      type: object
      required: [id, email, role, invitedAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
        invitedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          type: string
          description: Absent on the last page.

    Money:
      type: object
      required: [cents, currency]
      description: An amount in integer cents of `currency`, never a float. Never negative unless the field says so.
      additionalProperties: false
      properties:
        cents:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: BRL
    Cents:
      type: integer
      format: int64
      minimum: 0
      maximum: 100000000000
      description: An amount in integer cents of the store's currency.
    Margin:
      type: object
      required: [cents, basisPoints]
      description: |
        Price minus cost, computed by the server and never stored. Negative
        when the cost is above the price. `basisPoints` is the margin over
        the price in hundredths of a percent, rounded toward zero: 3000 is
        30%.
      properties:
        cents:
          type: integer
          format: int64
        basisPoints:
          type: integer
    SourcingMode:
      type: string
      enum: [to_order, stock, in_house]
      description: |
        Sob encomenda / Estoque / Produção própria. `stock` and `in_house`
        are refused (`400 invalid`) while the store has Estoque or Produção
        turned off.
    Days:
      type: integer
      minimum: 0
      maximum: 365
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    SetPublishedRequest:
      type: object
      additionalProperties: false
      required: [published, version]
      properties:
        published:
          type: boolean
        version:
          type: integer
          minimum: 1
    Reference:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string

    Category:
      type: object
      required: [id, name, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Bancos
        position:
          type: integer
          minimum: 0
          description: Place in the store's order, from 0.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        position:
          type: integer
          minimum: 0
    CatalogName:
      type: string
      minLength: 1
      maxLength: 120
      description: Trimmed by the server; blank is refused.

    Attribute:
      type: object
      required: [id, name, position, values]
      description: An item field such as "Serve em", with the values items and kits pick (ADR 0025).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Serve em
        position:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"
    AttributeValue:
      type: object
      required: [id, label, usageCount]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
          example: CB 500X
        usageCount:
          type: integer
          minimum: 0
          description: Items and kits, archived ones included, that picked this value.
    AttributeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
    AttributeInput:
      type: object
      additionalProperties: false
      required: [name, values]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        values:
          type: array
          maxItems: 200
          description: In the store's order. Labels are unique within the field, ignoring case.
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                minLength: 1
                maxLength: 80

    SupplierItem:
      type: object
      required: [supplierId, supplierName, leadDays]
      description: A supplier of the item, its lead time and, for the owner, its cost.
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        leadDays:
          $ref: "#/components/schemas/Days"
        cost:
          description: Owner only; absent for every other role. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    SupplierItemInput:
      type: object
      additionalProperties: false
      required: [supplierId, leadDays]
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        leadDays:
          $ref: "#/components/schemas/Days"
        costCents:
          description: |
            Owner only: any other role sending it, even null, gets
            `403 forbidden`. Absent keeps the stored cost; null clears it.
            A cost belongs to the item and this supplier, not to the main or
            backup slot: a supplier newly linked to the item starts with no
            cost, swapping main and backup keeps each supplier's own cost,
            and unlinking a supplier drops its cost.
          oneOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
    CustomizationOption:
      type: object
      required: [id, name, required, choices]
      description: |
        A choice the client makes when ordering (ADR 0024): exactly one
        choice when `required`, at most one otherwise. Extra days are added
        to the item's ready date.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Cor da costura
        required:
          type: boolean
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, label, extraPrice, extraDays]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                example: Vermelha
              extraPrice:
                $ref: "#/components/schemas/Money"
              extraDays:
                $ref: "#/components/schemas/Days"
    CustomizationOptionInput:
      type: object
      additionalProperties: false
      required: [name, required, choices]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: Send it to keep an existing option; omit it for a new one.
        name:
          type: string
          minLength: 1
          maxLength: 80
        required:
          type: boolean
        choices:
          type: array
          minItems: 1
          maxItems: 50
          description: Labels are unique within the option, ignoring case.
          items:
            type: object
            additionalProperties: false
            required: [label, extraPriceCents, extraDays]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                minLength: 1
                maxLength: 80
              extraPriceCents:
                $ref: "#/components/schemas/Cents"
              extraDays:
                $ref: "#/components/schemas/Days"
    Photo:
      type: object
      required: [id, url, expiresAt, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        url:
          type: string
          format: uri
          description: A signed URL to read the photo. Read it again after `expiresAt`.
        expiresAt:
          type: string
          format: date-time
        position:
          type: integer
          minimum: 0
          maximum: 7
          description: 0 is the cover.
    PhotoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
    PhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, contentType]
      properties:
        ownerType:
          type: string
          enum: [item, kit]
        ownerId:
          $ref: "#/components/schemas/Uuid"
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    PhotoUpload:
      type: object
      required: [key, uploadUrl, method, headers, expiresAt]
      properties:
        key:
          type: string
          maxLength: 256
          description: Send it back to confirm. Opaque; never build one.
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Send exactly these headers with the upload.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ConfirmPhotoRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
    OrderPhotosRequest:
      type: object
      additionalProperties: false
      required: [photoIds]
      properties:
        photoIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"

    ItemSummary:
      type: object
      required: [id, name, categoryId, sourcingMode, price, readyDays, mainSupplierName, published, archived, cover, version]
      description: A row of the Itens table.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        price:
          $ref: "#/components/schemas/Money"
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        mainSupplierName:
          type: [string, "null"]
          description: Null for in-house items.
        published:
          type: boolean
        archived:
          type: boolean
        cover:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    ReadyDays:
      type: integer
      minimum: 0
      maximum: 365
      description: |
        Days the item needs before it is ready: the main supplier's lead time
        for `to_order` and `stock` (until stock on hand exists, milestone 6),
        the production days for `in_house` (ADR 0025).
    Item:
      type: object
      required:
        - id
        - name
        - description
        - categoryId
        - sourcingMode
        - price
        - productionDays
        - readyDays
        - mainSupplier
        - backupSupplier
        - attributeValueIds
        - options
        - photos
        - published
        - archived
        - version
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Banco de couro Scrambler
        description:
          type: string
          description: Empty when there is none.
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        price:
          $ref: "#/components/schemas/Money"
        productionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: "`in_house` only; null otherwise."
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        mainSupplier:
          description: "`to_order` and `stock`; null for `in_house`."
          oneOf:
            - $ref: "#/components/schemas/SupplierItem"
            - type: "null"
        backupSupplier:
          description: Fornecedor reserva; null when there is none.
          oneOf:
            - $ref: "#/components/schemas/SupplierItem"
            - type: "null"
        attributeValueIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        options:
          type: array
          items:
            $ref: "#/components/schemas/CustomizationOption"
        photos:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
        published:
          type: boolean
          description: Shown on the store page ("No portal"). Always false when archived.
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        productionCost:
          description: Owner only, `in_house` only; absent otherwise. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        cost:
          description: |
            Owner only; absent for every other role. The cost the margin
            uses: the main supplier's, or the production cost. Null when none
            is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    ItemInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, description, categoryId, sourcingMode, priceCents, attributeValueIds, options, published]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        description:
          type: string
          maxLength: 2000
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        priceCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: In the store's currency.
        productionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Required for `in_house`; must be absent or null otherwise.
        productionCostCents:
          description: |
            Owner only, `in_house` only; as `SupplierItemInput.costCents`.
            Changing the sourcing mode away from `in_house` drops the
            production cost; coming back starts with none.
          oneOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        mainSupplier:
          description: Required for `to_order` and `stock`; must be absent or null for `in_house`.
          oneOf:
            - $ref: "#/components/schemas/SupplierItemInput"
            - type: "null"
        backupSupplier:
          description: Optional; a supplier other than the main one.
          oneOf:
            - $ref: "#/components/schemas/SupplierItemInput"
            - type: "null"
        attributeValueIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        options:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CustomizationOptionInput"
        published:
          type: boolean
    ReplaceItemRequest:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    KitDays:
      type: object
      required: [slowestItem, assembly, safetyMargin, total]
      description: |
        "Prazo calculado": the slowest item's ready days + assembly days +
        safety margin, computed by the server (ADR 0025). Option choices
        made by a client add to this on an order (milestone 4).
      properties:
        slowestItem:
          $ref: "#/components/schemas/ReadyDays"
        assembly:
          type: integer
          minimum: 0
          description: The kit's own value, or the store's default.
        safetyMargin:
          type: integer
          minimum: 0
          description: The kit's own value, or the store's default.
        total:
          type: integer
          minimum: 0
    KitItem:
      type: object
      required: [itemId, itemName, quantity, swappable, alternativeItemIds, unitPrice, readyDays, archived]
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
        itemName:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        swappable:
          type: boolean
          description: Cliente pode trocar.
        alternativeItemIds:
          type: array
          description: Pode trocar por. Empty unless `swappable`.
          items:
            $ref: "#/components/schemas/Uuid"
        unitPrice:
          $ref: "#/components/schemas/Money"
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        archived:
          type: boolean
          description: True when the item was archived after the kit was saved; the kit cannot be saved again until it is replaced.
    SwapDiscount:
      type: string
      enum: [keep, lose]
      description: |
        What a client's swap does to the price (ADR 0023). `keep` (the
        default): kit price − removed item + new item, both at single-item
        price. `lose`: the sum of the resulting items' single-item prices.
    KitSummary:
      type: object
      required: [id, name, itemCount, price, singleItemsTotal, totalDays, published, archived, cover, version]
      description: A row of the Kits table.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        itemCount:
          type: integer
          minimum: 1
        price:
          $ref: "#/components/schemas/Money"
        singleItemsTotal:
          $ref: "#/components/schemas/Money"
        totalDays:
          type: integer
          minimum: 0
        published:
          type: boolean
        archived:
          type: boolean
        cover:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. Null when an item of the kit has no cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    KitPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KitSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    Kit:
      type: object
      required:
        - id
        - name
        - description
        - price
        - singleItemsTotal
        - discount
        - swapDiscount
        - assemblyDays
        - safetyMarginDays
        - days
        - items
        - attributeValueIds
        - photos
        - published
        - archived
        - version
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Kit Scrambler CB 500X
        description:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        singleItemsTotal:
          $ref: "#/components/schemas/Money"
          description: Soma dos itens avulsos, quantities included.
        discount:
          $ref: "#/components/schemas/Money"
          description: Desconto do kit, `singleItemsTotal − price`. Negative when the kit costs more than its items.
        swapDiscount:
          $ref: "#/components/schemas/SwapDiscount"
        assemblyDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
          description: The kit's own assembly days; null uses the store's default.
        safetyMarginDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
          description: The kit's own safety margin; null uses the store's default.
        days:
          $ref: "#/components/schemas/KitDays"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KitItem"
        attributeValueIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        photos:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
        published:
          type: boolean
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. The sum of the items' costs times their quantities; null when one has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Kit price minus cost; null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    KitInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, description, priceCents, swapDiscount, assemblyDays, safetyMarginDays, items, attributeValueIds, published]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        description:
          type: string
          maxLength: 2000
        priceCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
        swapDiscount:
          $ref: "#/components/schemas/SwapDiscount"
        assemblyDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
        safetyMarginDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: An item appears once; an alternative is never the item itself or archived.
          items:
            type: object
            additionalProperties: false
            required: [itemId, quantity, swappable, alternativeItemIds]
            properties:
              itemId:
                $ref: "#/components/schemas/Uuid"
              quantity:
                type: integer
                minimum: 1
                maximum: 99
              swappable:
                type: boolean
              alternativeItemIds:
                type: array
                maxItems: 50
                uniqueItems: true
                description: At least one when `swappable`; empty otherwise.
                items:
                  $ref: "#/components/schemas/Uuid"
        attributeValueIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        published:
          type: boolean
    ReplaceKitRequest:
      allOf:
        - $ref: "#/components/schemas/KitInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    SupplierPhone:
      type: string
      pattern: "^55[1-9]{2}[0-9]{8,9}$"
      description: Digits only, 55 + DDD + number, as wa.me links need it.
      example: "5511987654321"
    Supplier:
      type: object
      required: [id, name, whatsappPhone, version]
      description: A supplier of the store. Staff only; never on the store page. It carries no cost.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Couros Paulista
        whatsappPhone:
          $ref: "#/components/schemas/SupplierPhone"
        version:
          type: integer
          minimum: 1
    SupplierPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          description: Absent on the last page.
    SupplierInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, whatsappPhone]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        whatsappPhone:
          $ref: "#/components/schemas/SupplierPhone"
    ReplaceSupplierRequest:
      allOf:
        - $ref: "#/components/schemas/SupplierInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    CivilDate:
      type: string
      format: date
      description: A calendar day, `YYYY-MM-DD`, with no time and no zone. Days count in the store's time zone (ADR 0030).
      example: "2026-12-21"
    TimeZone:
      type: string
      enum: [America/Noronha, America/Sao_Paulo, America/Manaus, America/Rio_Branco]
      default: America/Sao_Paulo
      description: |
        The store's time zone, one per Brazilian offset (ADR 0030). It
        decides which day "today" is for dates and alerts. Always present in
        the settings the server answers (served since step 4.8), and
        optional in a settings update. A store starts on America/Sao_Paulo;
        an update that leaves it out keeps the stored zone.
    Phase:
      type: string
      enum: [draft, awaiting_deposit, confirmed, sourcing, assembling, ready, handed_over, cancelled]
      description: |
        The fixed phase a status belongs to (ADR 0004). Rules hang on it,
        and a status badge takes its color from it, never from the label.
    StatusKey:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,62}$"
      description: A status of the order's own workflow. `cancelled` is the status every workflow ends in when an order is cancelled.
      example: em_montagem
    OrderStatus:
      type: object
      required: [key, label, clientLabel, phase]
      description: A status of a workflow, with its names for staff and for clients.
      properties:
        key:
          $ref: "#/components/schemas/StatusKey"
        label:
          type: string
          description: What staff see.
          example: Em montagem
        clientLabel:
          type: string
          description: What the client sees on the tracking page.
          example: Montando seu pedido
        phase:
          $ref: "#/components/schemas/Phase"
    StatusWorkflow:
      type: object
      required: [id, version, key, name, statuses]
      description: A status workflow preset at one version. Published versions never change.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        version:
          type: integer
          minimum: 1
        key:
          type: string
          example: encomenda_montagem
        name:
          type: string
          example: Encomenda com montagem
        statuses:
          type: array
          minItems: 4
          description: In order; `cancelled` is implicit and never listed.
          items:
            $ref: "#/components/schemas/OrderStatus"
    StatusWorkflowList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatusWorkflow"
    ChooseWorkflowRequest:
      type: object
      additionalProperties: false
      required: [workflowId, version, expectedVersion]
      properties:
        workflowId:
          $ref: "#/components/schemas/Uuid"
        version:
          type: integer
          minimum: 1
          description: The preset's version.
        expectedVersion:
          type: integer
          minimum: 1
          description: The settings `version` you read.

    CustomerPhone:
      type: string
      pattern: "^55[1-9]{2}[0-9]{8,9}$"
      description: The customer's WhatsApp number, digits only, 55 + DDD + number. Unique in the store.
      example: "5592991234567"
    UF:
      type: string
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    Address:
      type: object
      required: [id, label, cep, street, number, complement, district, city, state]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
          example: Casa
        cep:
          type: string
          pattern: "^[0-9]{8}$"
          example: "69057000"
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          $ref: "#/components/schemas/UF"
    AddressInput:
      type: object
      additionalProperties: false
      required: [label, cep, street, city, state]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: Send it to keep an existing address; omit it for a new one.
        label:
          type: string
          minLength: 1
          maxLength: 40
        cep:
          type: string
          pattern: "^[0-9]{8}$"
        street:
          type: string
          minLength: 1
          maxLength: 200
        number:
          type: string
          maxLength: 20
        complement:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          $ref: "#/components/schemas/UF"
    Customer:
      type: object
      required: [id, name, phone, email, notes, addresses, version]
      description: A customer of this store. Never shared with another store, even for the same person.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: João Pereira
        phone:
          $ref: "#/components/schemas/CustomerPhone"
        email:
          type: [string, "null"]
          format: email
        notes:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        version:
          type: integer
          minimum: 1
    CustomerInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, phone, addresses]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: "#/components/schemas/CustomerPhone"
        email:
          oneOf:
            - $ref: "#/components/schemas/Email"
            - type: "null"
        notes:
          type: string
          maxLength: 2000
        addresses:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AddressInput"
    ReplaceCustomerRequest:
      allOf:
        - $ref: "#/components/schemas/CustomerInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1
    CustomerSummary:
      type: object
      required: [id, name, phone, orders]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        phone:
          $ref: "#/components/schemas/CustomerPhone"
        orders:
          type: integer
          minimum: 0
          description: Orders of this customer in the store, cancelled ones included.
        lastOrderAt:
          type: string
          format: date-time
          description: Absent when the customer has no order.
    CustomerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    NewCustomer:
      type: object
      additionalProperties: false
      required: [name, phone]
      description: A customer made inside "Novo pedido". An existing customer with this number is used instead, unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: "#/components/schemas/CustomerPhone"

    Handover:
      type: string
      enum: [delivery, pickup]
      description: Entrega / Retirada.
    ItemStatus:
      type: string
      enum: [to_buy, sent_to_supplier, in_transit, received, planned, in_production, ready, installed]
      description: |
        An order item's state, by sourcing mode (ADR 0030):
        `to_order` and `stock` go `to_buy → sent_to_supplier → in_transit →
        received → installed`; `in_house` goes `planned → in_production →
        ready → installed`.
    Check:
      type: string
      enum: [ok, defective]
      description: Tudo certo / Com defeito, recorded when an item is received or made.
    AlertKind:
      type: string
      enum: [at_risk, late]
      description: |
        `at_risk` ("Pode atrasar"): the item is expected after the date it
        must arrive by. `late` ("Atrasada"): its expected date passed and it
        has not arrived. Alerts sit on top of the status; staff only.
    Alert:
      type: object
      required: [kind, itemId]
      properties:
        kind:
          $ref: "#/components/schemas/AlertKind"
        itemId:
          $ref: "#/components/schemas/Uuid"
          description: The order item the alert is about.
    PaymentKind:
      type: string
      enum: [deposit, balance]
      description: Sinal / Saldo.
    PaymentMethod:
      type: string
      enum: [pix, dinheiro, cartao_credito, cartao_debito, transferencia, outro]
      description: How the store received the money. Recorded by hand; no payment provider (ADR 0023).
    Actor:
      type: object
      required: [id, name]
      description: The staff member who did something.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string

    OptionChoice:
      type: object
      additionalProperties: false
      required: [itemId, optionId, choiceId]
      description: The client's choice for one of a catalog item's options.
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
          description: The catalog item the option belongs to (the loose item, or an item of the kit).
        optionId:
          $ref: "#/components/schemas/Uuid"
        choiceId:
          $ref: "#/components/schemas/Uuid"
    Swap:
      type: object
      additionalProperties: false
      required: [itemId, withItemId]
      description: Replace a swappable kit item with one of its alternatives ("trocar item").
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
        withItemId:
          $ref: "#/components/schemas/Uuid"
    LineRequest:
      type: object
      additionalProperties: false
      description: |
        One line of the order: a kit (`kitId`, with its swaps and the
        options of its items) or a loose item (`itemId` and `quantity`).
        Exactly one of `kitId` and `itemId`. A required option with no
        choice, a choice of another option, an archived item or kit, and
        every kit swap rule are refused.
      properties:
        kitId:
          $ref: "#/components/schemas/Uuid"
        itemId:
          $ref: "#/components/schemas/Uuid"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: |
            Required for a loose item, 1 to 99. A kit line is always one kit
            and refuses a quantity (add the kit again for another).
        swaps:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Swap"
        options:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/OptionChoice"
    TermsInput:
      type: object
      additionalProperties: false
      required: [handover]
      description: |
        How the order is handed over and paid.

        - On a new order or a quote, a field left out takes the default: the
          store's deposit percent, the kit's or the store's assembly and
          safety margin days, no freight, no discount. A discount, deposit
          percent or days other than the default need `order:manage`.
        - On a change (`PUT /orders/{orderId}`, or a quote with `orderId`),
          a field left out keeps the order's current value, and a discount,
          deposit percent or days different from the order's current ones
          need `order:manage`, whatever the store default is. Staff can
          change lines without resending terms an owner or admin set, and
          can never put them back to the default.
      properties:
        handover:
          $ref: "#/components/schemas/Handover"
        addressId:
          $ref: "#/components/schemas/Uuid"
          description: One of the customer's addresses. A delivery needs this or `newAddress`, never both.
        newAddress:
          $ref: "#/components/schemas/AddressInput"
          description: |
            "Novo endereço": delivery only, and not together with `addressId`.
            On a create or a change the server adds it to the customer, in
            the same transaction, and delivers there; `order:write` is
            enough, though editing or removing a customer's addresses
            needs `customer:write`. A quote uses it without saving it. Its
            `id` is ignored. A refused field is reported as
            `terms.newAddress.<field>` (`terms.newAddress` for the limit of
            10 addresses).
        freightCents:
          $ref: "#/components/schemas/Cents"
          description: Frete; delivery only.
        discountCents:
          $ref: "#/components/schemas/Cents"
          description: Desconto; never above the lines' total.
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Sinal for this order.
        assemblyDays:
          type: integer
          minimum: 0
          maximum: 60
        safetyMarginDays:
          type: integer
          minimum: 0
          maximum: 60
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [lines, terms]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/LineRequest"
        terms:
          $ref: "#/components/schemas/TermsInput"
        orderId:
          $ref: "#/components/schemas/Uuid"
          description: Quote a change to this order.
    ChosenOption:
      type: object
      required: [optionId, choiceId, name, label, extraPrice, extraDays]
      description: An option choice as it was when the order was made.
      properties:
        optionId:
          $ref: "#/components/schemas/Uuid"
        choiceId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Cor da costura
        label:
          type: string
          example: Vermelha
        extraPrice:
          $ref: "#/components/schemas/Money"
        extraDays:
          $ref: "#/components/schemas/Days"
    QuoteItem:
      type: object
      required: [catalogItemId, name, sourcingMode, quantity, unitPrice, options, expectedDate]
      properties:
        catalogItemId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: "#/components/schemas/Money"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChosenOption"
        expectedDate:
          $ref: "#/components/schemas/CivilDate"
    QuoteLine:
      type: object
      required: [kit, price, items]
      properties:
        kit:
          oneOf:
            - $ref: "#/components/schemas/KitRef"
            - type: "null"
        price:
          $ref: "#/components/schemas/Money"
          description: The line's price, options included.
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
    Quote:
      type: object
      required: [lines, subtotal, freight, discount, total, refundDue, depositPercent, depositDue, assemblyDays, safetyMarginDays, deliveryDate, daysAfterDeposit, arrivalLimit]
      description: |
        Prices, deposit and dates, all computed by the server; the client
        does no money or date arithmetic. `cost` and `margin` are owner
        only: absent for every other role, and null for the owner when an
        item's cost is unknown.
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
        subtotal:
          $ref: "#/components/schemas/Money"
        freight:
          $ref: "#/components/schemas/Money"
        discount:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        refundDue:
          $ref: "#/components/schemas/Money"
          description: |
            "Valor a devolver" after the change: what the order would owe
            back when the new total is below what was paid. Always zero for
            a new order.
        depositPercent:
          type: integer
        depositDue:
          $ref: "#/components/schemas/Money"
          description: The full deposit (Sinal) of the quoted order.
        assemblyDays:
          type: integer
          description: The days counted in the deadline; 0 when the workflow has no assembling.
        safetyMarginDays:
          type: integer
        deliveryDate:
          $ref: "#/components/schemas/CivilDate"
        daysAfterDeposit:
          type: integer
          description: |
            Calendar days from the day the deadline counts from to
            `deliveryDate`, for "({n} dias depois do sinal)". That day is
            today (the store's) for a new order and for a change to an order
            not yet released, and the order's `releaseDate` for a change to
            a released one.
        arrivalLimit:
          $ref: "#/components/schemas/CivilDate"
          description: Precisa chegar até.
        cost:
          description: Owner only; absent for every other role. Null when an item's cost is unknown.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Over what is sold (the total less the freight). Null without a full cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [lines, terms]
      description: Exactly one of `customerId` and `newCustomer`.
      properties:
        customerId:
          $ref: "#/components/schemas/Uuid"
        newCustomer:
          $ref: "#/components/schemas/NewCustomer"
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/LineRequest"
        terms:
          $ref: "#/components/schemas/TermsInput"
        sendToCustomer:
          type: boolean
          default: false
          description: '"Salvar e enviar ao cliente": move to the status after the first and answer a `whatsappUrl`.'
    CreatedOrder:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        trackingUrl:
          type: string
          format: uri
          description: The tracking link, in this answer only. Absent on a replay.
        whatsappUrl:
          type: string
          format: uri
          description: With `sendToCustomer`, the wa.me link with the summary for the customer.
    ChangeOrderRequest:
      type: object
      additionalProperties: false
      required: [lines, terms, customerApproved, version]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/LineRequest"
        terms:
          $ref: "#/components/schemas/TermsInput"
        customerApproved:
          type: boolean
          description: The seller confirms the customer agreed. Needed once the order was paid; recorded with who confirmed it.
        version:
          type: integer
          minimum: 1
    OrderChange:
      type: object
      required: [paid, oldTotal, newTotal, oldDeliveryDate, newDeliveryDate, refundDue]
      properties:
        paid:
          type: boolean
          description: The order had a payment, was released or was past awaiting deposit.
        oldTotal:
          $ref: "#/components/schemas/Money"
        newTotal:
          $ref: "#/components/schemas/Money"
        oldDeliveryDate:
          $ref: "#/components/schemas/CivilDate"
        newDeliveryDate:
          $ref: "#/components/schemas/CivilDate"
        refundDue:
          $ref: "#/components/schemas/Money"
    ChangedOrder:
      type: object
      required: [order, change]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        change:
          $ref: "#/components/schemas/OrderChange"
        whatsappUrl:
          type: string
          format: uri
          description: Present when the order was paid; the wa.me link with the change summary for the customer. It never carries a tracking link.
    AdvanceRequest:
      type: object
      additionalProperties: false
      required: [to, version]
      properties:
        to:
          $ref: "#/components/schemas/StatusKey"
        handover:
          $ref: "#/components/schemas/Handover"
          description: Required to enter handed over.
        version:
          type: integer
          minimum: 1
    MoveItemRequest:
      type: object
      additionalProperties: false
      required: [to, version]
      properties:
        to:
          $ref: "#/components/schemas/ItemStatus"
        check:
          $ref: "#/components/schemas/Check"
          description: Required for `received` and `ready`.
        version:
          type: integer
          minimum: 1
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [kind, amountCents, method, version]
      properties:
        kind:
          $ref: "#/components/schemas/PaymentKind"
        amountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
        method:
          $ref: "#/components/schemas/PaymentMethod"
        version:
          type: integer
          minimum: 1
    VoidPaymentRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1
    DeliveryDateRequest:
      type: object
      additionalProperties: false
      required: [date, version]
      properties:
        date:
          $ref: "#/components/schemas/CivilDate"
        reason:
          type: string
          maxLength: 500
          description: Optional; goes into the history and the message to the client.
        version:
          type: integer
          minimum: 1
    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1
    MessagedOrder:
      type: object
      required: [order, whatsappUrl]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        whatsappUrl:
          type: string
          format: uri
          description: The wa.me link with the message for the client. Nothing was sent. It never carries a tracking link.
    TrackingLink:
      type: object
      required: [trackingUrl, whatsappUrl]
      properties:
        trackingUrl:
          type: string
          format: uri
          description: The new tracking link; the previous one no longer works.
        whatsappUrl:
          type: string
          format: uri

    KitRef:
      type: object
      required: [id, name, swaps]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        swaps:
          type: array
          items:
            type: object
            required: [removedItemId, removedName, addedItemId, addedName]
            properties:
              removedItemId:
                $ref: "#/components/schemas/Uuid"
              removedName:
                type: string
              addedItemId:
                $ref: "#/components/schemas/Uuid"
              addedName:
                type: string
    OrderLine:
      type: object
      required: [id, kit, price, itemIds]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kit:
          description: Null for a loose item.
          oneOf:
            - $ref: "#/components/schemas/KitRef"
            - type: "null"
        price:
          $ref: "#/components/schemas/Money"
        itemIds:
          type: array
          description: The order items of this line, in `Order.items`.
          items:
            $ref: "#/components/schemas/Uuid"
    ItemSupplier:
      type: object
      required: [name, leadDays]
      description: Staff data; never in a client view.
      properties:
        name:
          type: string
        leadDays:
          $ref: "#/components/schemas/Days"
    OrderItem:
      type: object
      required: [id, lineId, catalogItemId, name, sourcingMode, quantity, unitPrice, options, status, check, expectedDate, arrivedOn, arrived, alerts, nextMoves]
      description: One item of the order, as snapshotted when it was added; later catalog edits never change it.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        lineId:
          $ref: "#/components/schemas/Uuid"
        catalogItemId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: "#/components/schemas/Money"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChosenOption"
        status:
          $ref: "#/components/schemas/ItemStatus"
        check:
          oneOf:
            - $ref: "#/components/schemas/Check"
            - type: "null"
        expectedDate:
          $ref: "#/components/schemas/CivilDate"
        arrivedOn:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
        arrived:
          type: boolean
          description: Received and checked ok, made and checked ok, or installed.
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertKind"
        nextMoves:
          type: array
          description: |
            What `POST …/move` accepts now. For a bought item only
            `installed`, once received: Compras and Receber itens move the
            rest (ADR 0031).
          items:
            $ref: "#/components/schemas/ItemStatus"
        supplier:
          $ref: "#/components/schemas/ItemSupplier"
          description: Bought items only.
        backupSupplier:
          $ref: "#/components/schemas/ItemSupplier"
          description: Present while "Usar o fornecedor reserva" is possible.
        cost:
          description: Owner only; absent for every other role. Per unit, at order time; null when unknown.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    Payment:
      type: object
      required: [id, kind, amount, method, recordedBy, recordedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/PaymentKind"
        amount:
          $ref: "#/components/schemas/Money"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        recordedBy:
          $ref: "#/components/schemas/Actor"
          description: Who recorded it ("Registrado por"). The name is empty when the user no longer exists.
        recordedAt:
          type: string
          format: date-time
        voided:
          type: object
          required: [by, at, reason]
          description: Present when the owner voided it.
          properties:
            by:
              $ref: "#/components/schemas/Actor"
            at:
              type: string
              format: date-time
            reason:
              type: string
    Editability:
      type: string
      enum: [free, approval, closed]
      description: |
        `free`: a change needs `order:write`. `approval`: the order was paid,
        so a change needs `order:manage` and the customer's approval.
        `closed`: assembling or later; no change.
    Order:
      type: object
      required:
        - id
        - number
        - customer
        - status
        - workflow
        - moves
        - lines
        - items
        - handover
        - address
        - subtotal
        - freight
        - discount
        - total
        - depositPercent
        - depositDue
        - depositOwed
        - depositPaid
        - paid
        - balanceDue
        - refundDue
        - released
        - payments
        - releaseDate
        - deliveryDate
        - deliveryDateChanged
        - arrivalLimit
        - assemblyDays
        - safetyMarginDays
        - editable
        - createdAt
        - version
      description: An order as staff see it. The client's view is `TrackingOrder`, a separate shape.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: string
          pattern: "^P-[0-9]{4,}$"
          example: P-0231
        customer:
          type: object
          required: [id, name, phone, whatsappUrl]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            name:
              type: string
            phone:
              $ref: "#/components/schemas/CustomerPhone"
            whatsappUrl:
              type: string
              format: uri
              description: |
                A `wa.me` link that opens the chat with the customer, with
                no text, for "Abrir conversa no WhatsApp". Clients never
                build wa.me links themselves.
              example: https://wa.me/5592981234567
        status:
          $ref: "#/components/schemas/OrderStatus"
        workflow:
          $ref: "#/components/schemas/StatusWorkflow"
          description: The workflow at the version the order was made with.
        moves:
          type: array
          description: The statuses `POST …/advance` accepts now (guards not checked).
          items:
            $ref: "#/components/schemas/OrderStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        handover:
          $ref: "#/components/schemas/Handover"
        address:
          description: The delivery address as it was when chosen; null for pickup.
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        subtotal:
          $ref: "#/components/schemas/Money"
        freight:
          $ref: "#/components/schemas/Money"
        discount:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
          description: subtotal + freight − discount.
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
        depositDue:
          $ref: "#/components/schemas/Money"
          description: The full deposit (Sinal), whatever was already paid.
        depositOwed:
          $ref: "#/components/schemas/Money"
          description: |
            The deposit still to pay: `depositDue` less the deposit payments
            not void, never below zero. "Registrar pagamento" prefills Sinal
            with it, and Saldo with `balanceDue`.
        depositPaid:
          type: boolean
        paid:
          $ref: "#/components/schemas/Money"
          description: Every payment not void.
        balanceDue:
          $ref: "#/components/schemas/Money"
        refundDue:
          $ref: "#/components/schemas/Money"
          description: Valor a devolver; zero unless a change brought the total below what was paid.
        released:
          type: boolean
          description: The owner released the order without the deposit.
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        releaseDate:
          description: The day the deposit was paid or the order released; dates count from it. Null before.
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
        deliveryDate:
          $ref: "#/components/schemas/CivilDate"
          description: The date promised to the client.
        deliveryDateChanged:
          type: boolean
          description: Someone with `order:manage` changed the date by hand, so the deposit no longer resets it.
        arrivalLimit:
          $ref: "#/components/schemas/CivilDate"
          description: Precisa chegar até = delivery date − assembly days.
        assemblyDays:
          type: integer
          minimum: 0
        safetyMarginDays:
          type: integer
          minimum: 0
        editable:
          $ref: "#/components/schemas/Editability"
        cancelReason:
          type: string
          description: Present when cancelled.
        createdAt:
          type: string
          format: date-time
        cost:
          description: Owner only; absent for every other role. Null when an item's cost is unknown.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Over what was sold (the total less the freight, which only passes through). Null without a full cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
        version:
          type: integer
          minimum: 1
    OrderSummary:
      type: object
      required: [id, number, customer, status, itemsReady, itemsTotal, deliveryDate, total, balanceDue, alerts]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: string
          example: P-0231
        customer:
          type: object
          required: [id, name]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            name:
              type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        itemsReady:
          type: integer
          minimum: 0
          description: Items that arrived.
        itemsTotal:
          type: integer
          minimum: 1
        deliveryDate:
          $ref: "#/components/schemas/CivilDate"
        total:
          $ref: "#/components/schemas/Money"
        balanceDue:
          $ref: "#/components/schemas/Money"
        alerts:
          type: array
          description: Today's alerts; empty for orders handed over or cancelled.
          items:
            $ref: "#/components/schemas/Alert"
    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    HistoryKind:
      type: string
      enum: [created, status, item, backup_supplier, payment, payment_voided, released, date, changed, tracking_link, cancelled, promised_date]
    HistoryEntry:
      type: object
      required: [kind, at]
      description: |
        One event of the order. Fields beyond `kind`, `at` and `by` appear
        when the kind has them. The purchasing entries (ADR 0031):

        - an item move made by purchasing is `item` with `itemId`,
          `itemName`, `itemFrom`, `itemTo` and `ref` (the pedido de compra;
          absent for an item received at the counter). A receipt has
          `check`; a defect lands on `itemTo: to_buy` and carries its note
          in `reason`. An undone send is a move back to `to_buy` with `ref`
          and no `check`.
        - `promised_date` has `itemId`, `itemName`, `newDate` (the supplier's
          date) and `ref`.
      properties:
        kind:
          $ref: "#/components/schemas/HistoryKind"
        at:
          type: string
          format: date-time
        by:
          oneOf:
            - $ref: "#/components/schemas/Actor"
            - type: "null"
          description: Null for an order placed on the store page (milestone 7).
        from:
          $ref: "#/components/schemas/OrderStatus"
        to:
          $ref: "#/components/schemas/OrderStatus"
        handover:
          $ref: "#/components/schemas/Handover"
          description: With a move into handed over, how it was handed over.
        itemId:
          $ref: "#/components/schemas/Uuid"
        itemName:
          type: string
        itemFrom:
          $ref: "#/components/schemas/ItemStatus"
        itemTo:
          $ref: "#/components/schemas/ItemStatus"
        check:
          $ref: "#/components/schemas/Check"
        paymentId:
          $ref: "#/components/schemas/Uuid"
        paymentKind:
          $ref: "#/components/schemas/PaymentKind"
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
          description: A payment's or a void's amount, or the new total of a change.
        oldDate:
          $ref: "#/components/schemas/CivilDate"
        newDate:
          $ref: "#/components/schemas/CivilDate"
        reason:
          type: string
        customerApproved:
          type: boolean
        ref:
          $ref: "#/components/schemas/SupplierOrderNumber"
          description: With an item move made by purchasing, or a promised date, the pedido de compra.
    HistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        nextCursor:
          type: string
          description: Absent on the last page.

    NeedKind:
      type: string
      enum: [late, at_risk, awaiting_deposit, ready_not_handed_over, refund_due]
      description: |
        Why an order is in "Precisa de você", in this order: an item late, an
        item at risk, awaiting the deposit for more than 3 days, ready and
        not handed over for more than 2 days, money to give back.
    Need:
      type: object
      required: [kind, order]
      properties:
        kind:
          $ref: "#/components/schemas/NeedKind"
        order:
          $ref: "#/components/schemas/OrderSummary"
        itemName:
          type: string
          description: With `late` and `at_risk`, the item.
        days:
          type: integer
          description: Days late, days waiting, or days ready, by kind.
        amount:
          $ref: "#/components/schemas/Money"
          description: With `refund_due`, the amount to give back.
    Today:
      type: object
      required: [today, counts, needsYou, upcoming, truncated]
      properties:
        truncated:
          type: boolean
          description: The store has more active orders than Hoje reads (500, earliest deliveries first); counts and needs cover only those. The screen says so.
        today:
          $ref: "#/components/schemas/CivilDate"
        counts:
          type: object
          required: [active, awaitingDeposit, withAlert, dueIn7Days]
          properties:
            active:
              type: integer
              minimum: 0
            awaitingDeposit:
              type: integer
              minimum: 0
            withAlert:
              type: integer
              minimum: 0
            dueIn7Days:
              type: integer
              minimum: 0
        needsYou:
          type: array
          items:
            $ref: "#/components/schemas/Need"
        upcoming:
          type: array
          maxItems: 20
          description: Active orders by delivery date.
          items:
            $ref: "#/components/schemas/OrderSummary"
    MoneyByKey:
      type: object
      required: [key, total]
      properties:
        key:
          type: string
          description: A `PaymentKind` or a `PaymentMethod`.
        total:
          $ref: "#/components/schemas/Money"
    FinanceSummary:
      type: object
      required: [from, to, received, toReceive, toRefund, margins, marginsTotal, truncated]
      description: Owner only.
      properties:
        truncated:
          type: boolean
          description: A list hit its read cap (500 active orders, 2000 hand-overs), so "A receber", "A devolver" or the margins cover only part of the store. The screen says so.
        marginsTotal:
          type: object
          required: [total, cost, margin]
          description: The period's total of the margins, computed by the server. `cost` and `margin` count only orders whose every cost was known.
          properties:
            total:
              $ref: "#/components/schemas/Money"
            cost:
              $ref: "#/components/schemas/Money"
            margin:
              oneOf:
                - $ref: "#/components/schemas/Margin"
                - type: "null"
        from:
          $ref: "#/components/schemas/CivilDate"
        to:
          $ref: "#/components/schemas/CivilDate"
        received:
          type: object
          required: [total, byKind, byMethod]
          description: Payments recorded in the period, voids excluded.
          properties:
            total:
              $ref: "#/components/schemas/Money"
            byKind:
              type: array
              items:
                $ref: "#/components/schemas/MoneyByKey"
            byMethod:
              type: array
              items:
                $ref: "#/components/schemas/MoneyByKey"
        toReceive:
          type: object
          required: [total, orders, list]
          description: Balances still due on active orders, whatever the period.
          properties:
            total:
              $ref: "#/components/schemas/Money"
            orders:
              type: integer
              minimum: 0
              description: How many orders `list` holds.
            list:
              type: array
              description: The active orders with a balance, by delivery date; each one's `balanceDue` is its share of `total`.
              items:
                $ref: "#/components/schemas/OrderSummary"
        toRefund:
          type: array
          description: Orders with "Valor a devolver".
          items:
            type: object
            required: [order, amount]
            properties:
              order:
                $ref: "#/components/schemas/OrderSummary"
              amount:
                $ref: "#/components/schemas/Money"
        margins:
          type: array
          description: Orders handed over in the period, with their margin where every cost was known.
          items:
            type: object
            required: [orderId, number, customerName, handedOverOn, total]
            properties:
              orderId:
                $ref: "#/components/schemas/Uuid"
              number:
                type: string
              customerName:
                type: string
              handedOverOn:
                $ref: "#/components/schemas/CivilDate"
              total:
                $ref: "#/components/schemas/Money"
              cost:
                description: Owner only, as every cost; null when an item's cost was unknown.
                oneOf:
                  - $ref: "#/components/schemas/Money"
                  - type: "null"
              margin:
                description: Owner only, as every margin; null without a full cost.
                oneOf:
                  - $ref: "#/components/schemas/Margin"
                  - type: "null"

    TrackingOrder:
      type: object
      x-served-from: M7
      additionalProperties: false
      required: [store, number, steps, cancelled, deliveryDate, items, total, paid, balanceDue, handover]
      description: |
        What the client sees on the tracking page (milestone 7 serves it; it
        is defined now so the client-visibility test checks the view type
        against it). It never carries a supplier, a cost, a margin, an
        alert, a staff name or the history (docs/architecture.md section
        2, rule 8), and no property may be added that could.
      properties:
        store:
          type: string
          description: The store's name.
        number:
          type: string
          example: P-0231
        steps:
          type: array
          description: The order's workflow statuses by their client labels, in order. A cancelled order shows one step.
          items:
            type: object
            additionalProperties: false
            required: [label, current]
            properties:
              label:
                type: string
              current:
                type: boolean
        cancelled:
          type: boolean
        deliveryDate:
          $ref: "#/components/schemas/CivilDate"
          description: |
            The date promised to the client (`orders.delivery_date`), never
            the items' expected dates: a forecast later than the promise is
            "Pode atrasar", which the client never sees.
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, quantity, options, arrived]
            properties:
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
              options:
                type: array
                description: "The chosen options in words, such as `Cor da costura: Vermelha`."
                items:
                  type: string
              arrived:
                type: boolean
                description: '"Pronto" when true, "A caminho" otherwise.'
        total:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        balanceDue:
          $ref: "#/components/schemas/Money"
        handover:
          $ref: "#/components/schemas/Handover"

    SupplierOrderNumber:
      type: string
      pattern: "^C-[0-9]{4,}$"
      example: C-0012
      description: A pedido de compra's number, counted per store from 1 (ADR 0031).
    PurchaseChoice:
      type: object
      required: [name, label]
      description: An option choice of a bought item, as the order item was sold.
      properties:
        name:
          type: string
          example: Cor
        label:
          type: string
          example: Preto
    ToBuyItem:
      type: object
      required: [orderId, orderNumber, orderItemId, catalogItemId, name, quantity, choices, arrivalLimit, replacement]
      properties:
        orderId:
          $ref: "#/components/schemas/Uuid"
        orderNumber:
          type: string
          example: P-0231
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        catalogItemId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        choices:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseChoice"
        arrivalLimit:
          $ref: "#/components/schemas/CivilDate"
        replacement:
          type: boolean
          description: '"Reposição": the item was received defective and is bought again.'
        cost:
          $ref: "#/components/schemas/Money"
          description: Unit cost at order time. The owner's only; absent for every other role.
    ToBuySupplier:
      type: object
      required: [supplierId, supplierName, items]
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        whatsappPhone:
          $ref: "#/components/schemas/SupplierPhone"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ToBuyItem"
    ToBuy:
      type: object
      required: [suppliers, truncated]
      properties:
        suppliers:
          type: array
          description: By supplier name.
          items:
            $ref: "#/components/schemas/ToBuySupplier"
        truncated:
          type: boolean
          description: True when the store has more active orders than one read covers (500).
    SupplierOrderRequest:
      type: object
      additionalProperties: false
      required: [supplierId, orderItemIds]
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        orderItemIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    SupplierMessagePreview:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The message as the supplier gets it; never with client data.
    PurchaseLineStatus:
      type: string
      enum: [sent, in_transit, received, defective, cancelled]
    NoticeReason:
      type: string
      enum: [order_cancelled, item_removed, item_changed]
      description: Why a sent line is no longer needed ("Avisar o fornecedor").
    PurchaseLine:
      type: object
      required: [id, orderId, orderNumber, orderItemId, catalogItemId, name, quantity, choices, status, promisedDate, expectedDate, arrivalLimit, alerts, notice, checkNote]
      description: Staff data; never in a client view.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        orderId:
          $ref: "#/components/schemas/Uuid"
        orderNumber:
          type: string
        orderItemId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Null once the item was removed from the order.
        catalogItemId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        choices:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseChoice"
        status:
          $ref: "#/components/schemas/PurchaseLineStatus"
        promisedDate:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
          description: The supplier's promised date for this line ("Prazo do fornecedor").
        expectedDate:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
          description: The order item's forecast ("Previsto"); null once removed.
        arrivalLimit:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
          description: The order's "Precisa chegar até"; null once removed.
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertKind"
        notice:
          oneOf:
            - $ref: "#/components/schemas/NoticeReason"
            - type: "null"
        checkNote:
          type: string
          description: The note of a defective check; empty otherwise.
        cost:
          $ref: "#/components/schemas/Money"
          description: Unit cost at order time. The owner's only.
        paidCost:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Unit price actually paid. The owner's only; absent for every other role.
    SupplierOrderState:
      type: string
      enum: [sent, in_transit, received, undone]
      description: |
        `sent` while a line is still sent; `in_transit` once every open line
        is in transit; `received` when no line is open; `undone` after
        "Desfazer envio".
    SupplierOrderSummary:
      type: object
      required: [id, number, supplierId, supplierName, sentAt, promisedDate, received, total, state]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          $ref: "#/components/schemas/SupplierOrderNumber"
        supplierId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        sentAt:
          type: string
          format: date-time
        promisedDate:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
        received:
          type: integer
          minimum: 0
          description: Lines received or found defective.
        total:
          type: integer
          minimum: 0
          description: Lines not cancelled; 0 once undone.
        state:
          $ref: "#/components/schemas/SupplierOrderState"
    SupplierOrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupplierOrderSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    SupplierOrder:
      allOf:
        - $ref: "#/components/schemas/SupplierOrderSummary"
        - type: object
          required: [sentBy, whatsappUrl, lines, canUndo, version]
          properties:
            sentBy:
              $ref: "#/components/schemas/Actor"
            whatsappUrl:
              type: string
              format: uri
              description: A `wa.me` link with no text, to open the chat with the supplier.
            lines:
              type: array
              items:
                $ref: "#/components/schemas/PurchaseLine"
            canUndo:
              type: boolean
              description: True while nothing on it was received or found defective.
            version:
              type: integer
              minimum: 1
    SentSupplierOrder:
      type: object
      required: [supplierOrder, whatsappUrl, text]
      properties:
        supplierOrder:
          $ref: "#/components/schemas/SupplierOrder"
        whatsappUrl:
          type: string
          format: uri
          description: The `wa.me` link with the message; the app opens it. Nothing was sent by the server.
        text:
          type: string
          description: The message, for "Copiar mensagem".
    PromisedDateRequest:
      type: object
      additionalProperties: false
      required: [version, date]
      properties:
        version:
          type: integer
          minimum: 1
        date:
          $ref: "#/components/schemas/CivilDate"
        lines:
          type: array
          maxItems: 200
          description: A different date for some lines.
          items:
            type: object
            additionalProperties: false
            required: [lineId, date]
            properties:
              lineId:
                $ref: "#/components/schemas/Uuid"
              date:
                $ref: "#/components/schemas/CivilDate"
    PaidPricesRequest:
      type: object
      additionalProperties: false
      required: [version, prices]
      properties:
        version:
          type: integer
          minimum: 1
        prices:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [lineId, cents]
            properties:
              lineId:
                $ref: "#/components/schemas/Uuid"
              cents:
                $ref: "#/components/schemas/Cents"
    ToReceiveLine:
      type: object
      required: [orderId, orderNumber, orderItemId, name, quantity, choices]
      properties:
        lineId:
          $ref: "#/components/schemas/Uuid"
          description: Present in a group's lines; absent in `toBuy` (items bought at the counter, received by `orderItemId`).
        orderId:
          $ref: "#/components/schemas/Uuid"
        orderNumber:
          type: string
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        choices:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseChoice"
    ToReceiveGroup:
      type: object
      required: [supplierOrderId, number, supplierName, lines]
      properties:
        supplierOrderId:
          $ref: "#/components/schemas/Uuid"
        number:
          $ref: "#/components/schemas/SupplierOrderNumber"
        supplierName:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ToReceiveLine"
    ToReceive:
      type: object
      required: [groups, toBuy, truncated]
      properties:
        groups:
          type: array
          description: Open pedidos de compra, oldest send first.
          items:
            $ref: "#/components/schemas/ToReceiveGroup"
        toBuy:
          type: array
          description: '"Comprados sem pedido de compra": items still in "A comprar".'
          items:
            $ref: "#/components/schemas/ToReceiveLine"
        truncated:
          type: boolean
    ReceiptPhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    ReceiptEntry:
      description: One entry of a receipt, for an open line or for an item bought at the counter.
      oneOf:
        - $ref: "#/components/schemas/ReceiptLineEntry"
        - $ref: "#/components/schemas/ReceiptCounterEntry"
    ReceiptLineEntry:
      type: object
      additionalProperties: false
      required: [lineId, check]
      properties:
        lineId:
          $ref: "#/components/schemas/Uuid"
        check:
          $ref: "#/components/schemas/Check"
        note:
          $ref: "#/components/schemas/DefectNote"
        photoKeys:
          $ref: "#/components/schemas/EntryPhotoKeys"
    ReceiptCounterEntry:
      type: object
      additionalProperties: false
      required: [orderItemId, check]
      properties:
        orderItemId:
          $ref: "#/components/schemas/Uuid"
          description: An item still in "A comprar", bought at the counter.
        check:
          $ref: "#/components/schemas/Check"
        note:
          $ref: "#/components/schemas/DefectNote"
        photoKeys:
          $ref: "#/components/schemas/EntryPhotoKeys"
    DefectNote:
      type: string
      maxLength: 500
      description: Required for `defective` ("O que houve?"); dropped for `ok`.
    EntryPhotoKeys:
      type: array
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        maxLength: 256
    ReceiptRequest:
      type: object
      additionalProperties: false
      required: [entries]
      description: At most 20 photos in all, invoice photos included; more is `400 invalid` on `invoicePhotoKeys`.
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReceiptEntry"
        invoicePhotoKeys:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            maxLength: 256
    OrderRef:
      type: object
      required: [orderId, orderNumber]
      properties:
        orderId:
          $ref: "#/components/schemas/Uuid"
        orderNumber:
          type: string
    Receipt:
      type: object
      required: [id, receivedAt, entries, completedOrders, backToBuy]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        receivedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            type: object
            required: [lineId, orderId, orderNumber, orderItemId, name, check]
            properties:
              lineId:
                $ref: "#/components/schemas/Uuid"
              orderId:
                $ref: "#/components/schemas/Uuid"
              orderNumber:
                type: string
              orderItemId:
                $ref: "#/components/schemas/Uuid"
              name:
                type: string
              check:
                $ref: "#/components/schemas/Check"
        completedOrders:
          type: array
          description: Orders whose every item has now arrived and been checked.
          items:
            $ref: "#/components/schemas/OrderRef"
        backToBuy:
          type: array
          description: Items found defective, back in "A comprar".
          items:
            type: object
            required: [orderItemId, name]
            properties:
              orderItemId:
                $ref: "#/components/schemas/Uuid"
              name:
                type: string
    Notice:
      type: object
      required: [lineId, supplierOrderId, number, supplierName, orderId, orderNumber, name, quantity, reason, whatsappUrl]
      properties:
        lineId:
          $ref: "#/components/schemas/Uuid"
        supplierOrderId:
          $ref: "#/components/schemas/Uuid"
        number:
          $ref: "#/components/schemas/SupplierOrderNumber"
        supplierName:
          type: string
        orderId:
          $ref: "#/components/schemas/Uuid"
        orderNumber:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        reason:
          $ref: "#/components/schemas/NoticeReason"
        whatsappUrl:
          type: string
          format: uri
          description: '"Avisar pelo WhatsApp": asks the supplier to cancel; never names the client.'
    NoticeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
    OrderPurchase:
      description: What purchasing knows of one bought item of the order; its fields follow `status`.
      oneOf:
        - $ref: "#/components/schemas/OrderPurchaseToBuy"
        - $ref: "#/components/schemas/OrderPurchaseLine"
    OrderPurchaseToBuy:
      type: object
      required: [orderItemId, supplierName, status]
      description: The item is in "A comprar".
      properties:
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        status:
          type: string
          enum: [to_buy]
        supplierChatUrl:
          $ref: "#/components/schemas/SupplierChatUrl"
    OrderPurchaseLine:
      type: object
      required: [orderItemId, supplierName, status, lineId, number]
      description: The item's open line, or else its latest one.
      properties:
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        status:
          type: string
          enum: [sent, in_transit, received, defective]
        lineId:
          $ref: "#/components/schemas/Uuid"
        supplierOrderId:
          $ref: "#/components/schemas/Uuid"
          description: Absent for an item received at the counter.
        number:
          oneOf:
            - $ref: "#/components/schemas/SupplierOrderNumber"
            - type: "null"
          description: Null for an item received at the counter.
        promisedDate:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
        supplierChatUrl:
          $ref: "#/components/schemas/SupplierChatUrl"
    SupplierChatUrl:
      type: string
      format: uri
      description: '"Falar com o fornecedor", a `wa.me` link with a text that never names the client. Only for `purchase:write`.'
    OrderPurchases:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderPurchase"
    PurchasingNeedKind:
      type: string
      enum: [to_send, no_promised_date, notify_supplier]
    PurchasingNeed:
      description: One purchasing entry of "Precisa de você"; its fields follow `kind`.
      oneOf:
        - $ref: "#/components/schemas/ToSendNeed"
        - $ref: "#/components/schemas/NoPromisedDateNeed"
        - $ref: "#/components/schemas/NotifySupplierNeed"
      discriminator:
        propertyName: kind
        mapping:
          to_send: "#/components/schemas/ToSendNeed"
          no_promised_date: "#/components/schemas/NoPromisedDateNeed"
          notify_supplier: "#/components/schemas/NotifySupplierNeed"
    ToSendNeed:
      type: object
      required: [kind, supplierId, supplierName, count]
      description: '"{n} itens para comprar de {fornecedor}."'
      properties:
        kind:
          type: string
          enum: [to_send]
        supplierId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        count:
          type: integer
          minimum: 1
          description: Entries in "A comprar" for the supplier (lines, not summed quantities).
    NoPromisedDateNeed:
      type: object
      required: [kind, supplierOrderId, number, supplierName, days]
      description: '"Pedido de compra C-0012 sem prazo do fornecedor há {n} dias."'
      properties:
        kind:
          type: string
          enum: [no_promised_date]
        supplierOrderId:
          $ref: "#/components/schemas/Uuid"
        number:
          $ref: "#/components/schemas/SupplierOrderNumber"
        supplierName:
          type: string
        days:
          type: integer
          minimum: 3
          description: Days since it was sent, in the store's time zone.
    NotifySupplierNeed:
      type: object
      required: [kind, lineId, supplierOrderId, number, supplierName, itemName]
      description: '"Avise {fornecedor}: {item} não é mais necessário (C-0012)."'
      properties:
        kind:
          type: string
          enum: [notify_supplier]
        lineId:
          $ref: "#/components/schemas/Uuid"
        supplierOrderId:
          $ref: "#/components/schemas/Uuid"
        number:
          $ref: "#/components/schemas/SupplierOrderNumber"
        supplierName:
          type: string
        itemName:
          type: string
    PurchasingToday:
      type: object
      required: [toSend, needs]
      properties:
        toSend:
          type: integer
          minimum: 0
          description: Items in "A comprar" ("Compras a enviar").
        needs:
          type: array
          description: Notices first, then pedidos de compra with no promised date, then items to send.
          items:
            $ref: "#/components/schemas/PurchasingNeed"
    SupplierItemUse:
      type: object
      required: [itemId, itemName, role, leadDays]
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
        itemName:
          type: string
        role:
          type: string
          enum: [main, backup]
        leadDays:
          $ref: "#/components/schemas/Days"
        cost:
          $ref: "#/components/schemas/Money"
          description: The owner's only.
    SupplierItemUseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupplierItemUse"
