        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NameTaken"
        "5XX":
          $ref: "#/components/responses/ServerFailure"
    delete:
