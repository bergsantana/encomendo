      responses:
        "200":
          description: The restored kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kit"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict`: someone saved first. `item_archived`: an item of the kit is archived; `references` names them."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/catalog/kits/{kitId}/photos:
    post:
      tags: [catalog]
      operationId: confirmKitPhoto
      summary: Record a photo uploaded to the key from `/catalog/photo-uploads`.
      description: |
        Needs `catalog:write`. The same checks as for an item's photo, with
        `kits/` in the key; confirming a key already recorded on this kit
        answers `200` with that photo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPhotoRequest"
      responses:
        "200":
          description: The key was already confirmed on this kit; the photo it recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "201":
          description: The photo, with a short-lived URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/PhotoRefused"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PhotoLimit"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/catalog/kits/{kitId}/photos/order:
    put:
      tags: [catalog]
      operationId: orderKitPhotos
      summary: Put the kit's photos in a new order; the first is the cover.
      description: Needs `catalog:write`. List every photo of the kit exactly once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPhotosRequest"
      responses:
        "200":
          description: The photos in their new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/catalog/kits/{kitId}/photos/{photoId}:
    delete:
      tags: [catalog]
      operationId: deleteKitPhoto
      summary: Remove a photo from the kit and from storage.
      description: Needs `catalog:write`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KitId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/catalog/photo-uploads:
    post:
      tags: [catalog]
      operationId: requestPhotoUpload
      summary: Get a short-lived URL to upload one photo of an item or kit.
      description: |
        Needs `catalog:write`. The server picks the key; apps never do
        (ADR 0024). Upload the file with `method` to `uploadUrl`, sending
        exactly `headers` and no `Authorization`, before `expiresAt`; then
        confirm it on the owner's `/photos`. An upload never confirmed is
        removed after a day. Limited to 30 requests a minute per user and 60
        per store (ADR 0021); over that, `429 rate_limited` with
        `Retry-After`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "201":
          description: Where and how to upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PhotoLimit"
        "429":
          $ref: "#/components/responses/RateLimited"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/suppliers:
    get:
      tags: [suppliers]
      operationId: listSuppliers
      summary: The store's suppliers, by name.
      description: Needs `catalog:read` (every role). Suppliers carry no cost.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of suppliers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierPage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "5XX":
          $ref: "#/components/responses/ServerFailure"
    post:
      tags: [suppliers]
      operationId: createSupplier
      summary: Add a supplier ("Novo fornecedor").
      description: Needs `catalog:write` (owner, admin; ADR 0025).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: The new supplier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

  /api/v1/admin/suppliers/{supplierId}:
    get:
      tags: [suppliers]
      operationId: getSupplier
      summary: One supplier.
      description: Needs `catalog:read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      responses:
        "200":
          description: The supplier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/ServerFailure"
    put:
      tags: [suppliers]
      operationId: replaceSupplier
      summary: Replace a supplier's name and WhatsApp.
      description: Needs `catalog:write`. Send the `version` you read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSupplierRequest"
      responses:
        "200":
          description: The supplier as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "5XX":
          $ref: "#/components/responses/ServerFailure"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from an `AuthSession`, audience `backoffice`. Client
        account tokens are rejected on these routes with 401.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-encomendo_refresh
      description: |
        Web only. HttpOnly; Secure; SameSite=Strict; Path=/; host-only; 30
        days. Named `encomendo_refresh`, without Secure, on a local stack over
        plain HTTP.

  headers:
    SetRefreshCookie:
      description: The refresh cookie with the new token, when the refresh transport is `cookie`.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds until the limit resets. Sent on every 429.
      required: true
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: Always `Bearer`.
      schema:
        type: string

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque position from the previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    KitId:
      name: kitId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Search:
      name: q
      in: query
      description: Only rows whose name contains this text, ignoring case.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CategoryFilter:
      name: categoryId
      in: query
      description: Only items of this category.
      schema:
        $ref: "#/components/schemas/Uuid"
    IncludeArchived:
      name: includeArchived
      in: query
      description: Also list archived rows ("Mostrar arquivados").
      schema:
        type: boolean
        default: false

  responses:
    AuthSession:
      description: A new session.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthSession"
    Invalid:
      description: "`invalid`: the input breaks a rule; `errors` lists the fields."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOrigin:
      description: |
        `forbidden`: a browser call from another origin, or whose
        `Sec-Fetch-Site` is not `same-origin` (ADR 0010). Native clients,
        which send neither header, never get it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerFailure:
      description: |
        `internal`: the server failed. `not_ready`: a dependency is down or
        busy, such as every password-hashing slot taken; wait `Retry-After`
        seconds. Never a 401: keep the session and try again (ADR 0013).
      headers:
        Retry-After:
          description: With `503 not_ready`, whole seconds to wait.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: "`unauthenticated`: no token, or an expired, tampered or wrong-audience one. Refresh once, then log in."
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        `forbidden`: the role lacks the permission. `tenant_required`: the
        session has no store selected; open the store picker.
        `tenant_suspended`: the store is suspended; show its message and
        open the store picker (ADR 0022).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`: no such thing in this store."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VersionConflict:
      description: "`version_conflict`: someone saved first. Reload and apply the change again."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited`: too many attempts. Wait `Retry-After` seconds."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NameTaken:
      description: "`name_taken`: another row of this kind already has this name, ignoring case."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ItemArchived:
      description: "`item_archived`: an item in the kit, or one of its alternatives, is archived; `references` names them."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PhotoRefused:
      description: |
        `photo_invalid`: the stored object is over 10 MB or not a JPEG, PNG
        or WebP image; it was deleted. `photo_not_uploaded`: nothing was
        uploaded to the key, or the key is not one issued for this item or
        kit in this store (the two are not told apart). `invalid`: the body
        breaks a rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PhotoLimit:
      description: "`photo_limit`: the item or kit already has 8 photos."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok]
    Problem:
      type: object
      description: RFC 9457 problem details. Branch on `code`, never on `title`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          description: Short pt-BR summary.
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable code. New codes may be added; existing ones never change.
          enum:
            - invalid
            - not_found
            - method_not_allowed
            - conflict
            - forbidden
            - internal
            - not_ready
            - unauthenticated
            - invalid_credentials
            - tenant_required
            - version_conflict
            - rate_limited
            - email_taken
            - slug_taken
            - already_member
            - invalid_code
            - email_unavailable
            - tenant_suspended
            - name_taken
            - category_in_use
            - item_in_kit
            - item_archived
            - photo_limit
            - photo_invalid
            - photo_not_uploaded
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"
        references:
          type: array
          description: With `item_in_kit` and `item_archived`, the rows the refusal names (the kits, or the archived items).
          items:
            $ref: "#/components/schemas/Reference"
    FieldIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            The path of the invalid value in the request body: property
            names joined by dots, with zero-based indexes in brackets, for
            example `mainSupplier.leadDays` or `options[0].choices[1].label`.
        message:
          type: string
          description: pt-BR text the client may show next to the field.

    Uuid:
      type: string
      format: uuid
      example: 0190f3c4-5e1a-7b2c-8d3e-4f5a6b7c8d9e
    Email:
      type: string
      format: email
      maxLength: 254
      description: Compared without regard to case.
      example: dono@altarpm.com.br
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ana Souza
    Password:
      type: string
      writeOnly: true
      minLength: 8
      maxLength: 128
      description: 8 to 128 characters. Stored only as an argon2id hash.
    Slug:
      type: string
      minLength: 3
      maxLength: 40
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: |
        The store's address label: `{slug}.encomendo.com.br`. Lower-case
        letters, digits and single hyphens. Reserved, and answered with
        `invalid`: the labels of the configured admin and API hosts, plus
        www, api, admin, app, conta, mail and static (the list the store app
        uses in web/apps/store/src/site.ts).
      example: altarpm
    Role:
      type: string
      enum: [owner, admin, staff, viewer]
      description: A staff member's role in one store (docs/architecture.md section 5.4).
    InvitableRole:
      type: string
      enum: [admin, staff, viewer]
      description: Any role but owner; a store has one owner.
    Permission:
      type: string
      enum:
        - catalog:read
        - catalog:write
        - finance:read
        - inventory:adjust
        - members:manage
        - order:read
        - order:write
        - portal:write
        - production:write
        - purchase:write
        - receiving:write
        - settings:read
        - settings:write
      description: New permissions are added as features land; existing ones never change.
    RefreshTransport:
      type: string
      enum: [cookie, body]
      default: cookie
      description: How the refresh token travels; see "Sessions" above. Android sends `body`.

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
    TenantSummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Alta RPM
        slug:
          $ref: "#/components/schemas/Slug"
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantSummary"
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    Membership:
      type: object
      required: [tenant, role, status]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [active, suspended]
          description: |
            `suspended`: the platform suspended the store. The picker shows
            it, marked "Suspensa", and cannot enter it (ADR 0022).
    Session:
      type: object
      required: [user, permissions, memberships]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
          description: The selected store. Absent when none is selected.
        role:
          $ref: "#/components/schemas/Role"
          description: The role in the selected store. Absent when none is selected.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: What the role allows in the selected store; empty when none is selected.
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
          description: Every store the user belongs to, for the store picker.
    AuthSession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [accessToken, tokenType, expiresIn]
          properties:
            accessToken:
              type: string
              description: JWT (EdDSA). Do not parse it; read the session fields instead.
            tokenType:
              type: string
              enum: [Bearer]
            expiresIn:
              type: integer
              description: Seconds until the access token expires (900).
              example: 900
            refreshToken:
              type: string
              description: Only with the `body` refresh transport.

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          writeOnly: true
          maxLength: 128
        tenantId:
          $ref: "#/components/schemas/Uuid"
          description: The store to select, such as the one used last on this device.
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Android only. The web app sends `{}` and the cookie.
    SwitchTenantRequest:
      type: object
      additionalProperties: false
      required: [tenantId]
      properties:
        tenantId:
          $ref: "#/components/schemas/Uuid"
        refreshToken:
          type: string
          description: Android only.
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Android only.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "482913"
        password:
          $ref: "#/components/schemas/Password"

    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          description: From the invitation link.
    InvitationPreview:
      type: object
      required: [tenant, email, role, accountExists, expiresAt]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
        accountExists:
          type: boolean
          description: True when the email already has an account; ask for its password instead of a name and a new one.
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 128
        name:
          $ref: "#/components/schemas/PersonName"
          description: Required when the email has no account yet; ignored otherwise.
        password:
          type: string
          writeOnly: true
          maxLength: 128
          description: The new password (8 to 128 characters) for a new account, or the existing account's password.
        refreshTransport:
          $ref: "#/components/schemas/RefreshTransport"

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The store's name as clients see it.
          example: Alta RPM
        slug:
          $ref: "#/components/schemas/Slug"
    StatusWorkflowRef:
      type: object
      required: [id, version, name]
      description: The status workflow new orders take (ADR 0004). Chosen in settings from milestone 4.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        version:
          type: integer
          minimum: 1
        name:
          type: string
          description: pt-BR name of the preset.
          example: Encomenda com montagem
    WhatsappPhone:
      type: [string, "null"]
      pattern: "^55[1-9]{2}[0-9]{8,9}$"
      description: |
        The store's WhatsApp number, digits only with country and area code
        (55 + DDD + number), as wa.me links need it. Null when not set.
      example: "5592991234567"
    EditableSettings:
      type: object
      required:
        - stockEnabled
        - productionEnabled
        - purchaseBeforeDeposit
        - depositPercent
        - assemblyDays
        - safetyMarginDays
        - whatsappPhone
      properties:
        stockEnabled:
          type: boolean
          description: Estoque menu and the `stock` sourcing mode.
        productionEnabled:
          type: boolean
          description: Produção menu and the `in_house` sourcing mode.
        purchaseBeforeDeposit:
          type: boolean
          description: Generate purchases before the deposit ("Sinal") is paid. Off by default.
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
        assemblyDays:
          type: integer
          minimum: 0
          maximum: 365
          example: 3
        safetyMarginDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Margem de segurança.
          example: 2
        whatsappPhone:
          $ref: "#/components/schemas/WhatsappPhone"
    TenantSettings:
      allOf:
        - $ref: "#/components/schemas/EditableSettings"
        - type: object
          required: [currency, statusWorkflow, version]
          properties:
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
              readOnly: true
              example: BRL
            statusWorkflow:
              $ref: "#/components/schemas/StatusWorkflowRef"
            version:
              type: integer
              minimum: 1
              description: Send it back on update; a stale one answers `version_conflict`.
    UpdateSettingsRequest:
      allOf:
        - $ref: "#/components/schemas/EditableSettings"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    Member:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        name:
          $ref: "#/components/schemas/PersonName"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          type: string
          description: Absent on the last page.
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/InvitableRole"
    InviteMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
    Invitation:
      type: object
      required: [id, email, role, invitedAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/InvitableRole"
        invitedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          type: string
          description: Absent on the last page.

    Money:
      type: object
      required: [cents, currency]
      description: An amount in integer cents of `currency`, never a float. Never negative unless the field says so.
      properties:
        cents:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: BRL
    Cents:
      type: integer
      format: int64
      minimum: 0
      maximum: 100000000000
      description: An amount in integer cents of the store's currency.
    Margin:
      type: object
      required: [cents, basisPoints]
      description: |
        Price minus cost, computed by the server and never stored. Negative
        when the cost is above the price. `basisPoints` is the margin over
        the price in hundredths of a percent, rounded toward zero: 3000 is
        30%.
      properties:
        cents:
          type: integer
          format: int64
        basisPoints:
          type: integer
    SourcingMode:
      type: string
      enum: [to_order, stock, in_house]
      description: |
        Sob encomenda / Estoque / Produção própria. `stock` and `in_house`
        are refused (`400 invalid`) while the store has Estoque or Produção
        turned off.
    Days:
      type: integer
      minimum: 0
      maximum: 365
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    SetPublishedRequest:
      type: object
      additionalProperties: false
      required: [published, version]
      properties:
        published:
          type: boolean
        version:
          type: integer
          minimum: 1
    Reference:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string

    Category:
      type: object
      required: [id, name, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Bancos
        position:
          type: integer
          minimum: 0
          description: Place in the store's order, from 0.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        position:
          type: integer
          minimum: 0
    CatalogName:
      type: string
      minLength: 1
      maxLength: 120
      description: Trimmed by the server; blank is refused.

    Attribute:
      type: object
      required: [id, name, position, values]
      description: An item field such as "Serve em", with the values items and kits pick (ADR 0025).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Serve em
        position:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"
    AttributeValue:
      type: object
      required: [id, label, usageCount]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
          example: CB 500X
        usageCount:
          type: integer
          minimum: 0
          description: Items and kits, archived ones included, that picked this value.
    AttributeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
    AttributeInput:
      type: object
      additionalProperties: false
      required: [name, values]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        values:
          type: array
          maxItems: 200
          description: In the store's order. Labels are unique within the field, ignoring case.
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                minLength: 1
                maxLength: 80

    SupplierItem:
      type: object
      required: [supplierId, supplierName, leadDays]
      description: A supplier of the item, its lead time and, for the owner, its cost.
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        supplierName:
          type: string
        leadDays:
          $ref: "#/components/schemas/Days"
        cost:
          description: Owner only; absent for every other role. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    SupplierItemInput:
      type: object
      additionalProperties: false
      required: [supplierId, leadDays]
      properties:
        supplierId:
          $ref: "#/components/schemas/Uuid"
        leadDays:
          $ref: "#/components/schemas/Days"
        costCents:
          description: |
            Owner only: any other role sending it, even null, gets
            `403 forbidden`. Absent keeps the stored cost; null clears it.
            A cost belongs to the item and this supplier, not to the main or
            backup slot: a supplier newly linked to the item starts with no
            cost, swapping main and backup keeps each supplier's own cost,
            and unlinking a supplier drops its cost.
          oneOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
    CustomizationOption:
      type: object
      required: [id, name, required, choices]
      description: |
        A choice the client makes when ordering (ADR 0024): exactly one
        choice when `required`, at most one otherwise. Extra days are added
        to the item's ready date.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Cor da costura
        required:
          type: boolean
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, label, extraPrice, extraDays]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                example: Vermelha
              extraPrice:
                $ref: "#/components/schemas/Money"
              extraDays:
                $ref: "#/components/schemas/Days"
    CustomizationOptionInput:
      type: object
      additionalProperties: false
      required: [name, required, choices]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: Send it to keep an existing option; omit it for a new one.
        name:
          type: string
          minLength: 1
          maxLength: 80
        required:
          type: boolean
        choices:
          type: array
          minItems: 1
          maxItems: 50
          description: Labels are unique within the option, ignoring case.
          items:
            type: object
            additionalProperties: false
            required: [label, extraPriceCents, extraDays]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              label:
                type: string
                minLength: 1
                maxLength: 80
              extraPriceCents:
                $ref: "#/components/schemas/Cents"
              extraDays:
                $ref: "#/components/schemas/Days"
    Photo:
      type: object
      required: [id, url, expiresAt, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        url:
          type: string
          format: uri
          description: A signed URL to read the photo. Read it again after `expiresAt`.
        expiresAt:
          type: string
          format: date-time
        position:
          type: integer
          minimum: 0
          maximum: 7
          description: 0 is the cover.
    PhotoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
    PhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, contentType]
      properties:
        ownerType:
          type: string
          enum: [item, kit]
        ownerId:
          $ref: "#/components/schemas/Uuid"
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    PhotoUpload:
      type: object
      required: [key, uploadUrl, method, headers, expiresAt]
      properties:
        key:
          type: string
          maxLength: 256
          description: Send it back to confirm. Opaque; never build one.
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Send exactly these headers with the upload.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ConfirmPhotoRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
    OrderPhotosRequest:
      type: object
      additionalProperties: false
      required: [photoIds]
      properties:
        photoIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"

    ItemSummary:
      type: object
      required: [id, name, categoryId, sourcingMode, price, readyDays, mainSupplierName, published, archived, cover, version]
      description: A row of the Itens table.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        price:
          $ref: "#/components/schemas/Money"
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        mainSupplierName:
          type: [string, "null"]
          description: Null for in-house items.
        published:
          type: boolean
        archived:
          type: boolean
        cover:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    ReadyDays:
      type: integer
      minimum: 0
      maximum: 365
      description: |
        Days the item needs before it is ready: the main supplier's lead time
        for `to_order` and `stock` (until stock on hand exists, milestone 6),
        the production days for `in_house` (ADR 0025).
    Item:
      type: object
      required:
        - id
        - name
        - description
        - categoryId
        - sourcingMode
        - price
        - productionDays
        - readyDays
        - mainSupplier
        - backupSupplier
        - attributeValueIds
        - options
        - photos
        - published
        - archived
        - version
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Banco de couro Scrambler
        description:
          type: string
          description: Empty when there is none.
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        price:
          $ref: "#/components/schemas/Money"
        productionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: "`in_house` only; null otherwise."
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        mainSupplier:
          description: "`to_order` and `stock`; null for `in_house`."
          oneOf:
            - $ref: "#/components/schemas/SupplierItem"
            - type: "null"
        backupSupplier:
          description: Fornecedor reserva; null when there is none.
          oneOf:
            - $ref: "#/components/schemas/SupplierItem"
            - type: "null"
        attributeValueIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        options:
          type: array
          items:
            $ref: "#/components/schemas/CustomizationOption"
        photos:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
        published:
          type: boolean
          description: Shown on the store page ("No portal"). Always false when archived.
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        productionCost:
          description: Owner only, `in_house` only; absent otherwise. Null when no cost is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        cost:
          description: |
            Owner only; absent for every other role. The cost the margin
            uses: the main supplier's, or the production cost. Null when none
            is recorded.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    ItemInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, description, categoryId, sourcingMode, priceCents, attributeValueIds, options, published]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        description:
          type: string
          maxLength: 2000
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourcingMode:
          $ref: "#/components/schemas/SourcingMode"
        priceCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: In the store's currency.
        productionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Required for `in_house`; must be absent or null otherwise.
        productionCostCents:
          description: |
            Owner only, `in_house` only; as `SupplierItemInput.costCents`.
            Changing the sourcing mode away from `in_house` drops the
            production cost; coming back starts with none.
          oneOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        mainSupplier:
          description: Required for `to_order` and `stock`; must be absent or null for `in_house`.
          oneOf:
            - $ref: "#/components/schemas/SupplierItemInput"
            - type: "null"
        backupSupplier:
          description: Optional; a supplier other than the main one.
          oneOf:
            - $ref: "#/components/schemas/SupplierItemInput"
            - type: "null"
        attributeValueIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        options:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CustomizationOptionInput"
        published:
          type: boolean
    ReplaceItemRequest:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    KitDays:
      type: object
      required: [slowestItem, assembly, safetyMargin, total]
      description: |
        "Prazo calculado": the slowest item's ready days + assembly days +
        safety margin, computed by the server (ADR 0025). Option choices
        made by a client add to this on an order (milestone 4).
      properties:
        slowestItem:
          $ref: "#/components/schemas/ReadyDays"
        assembly:
          type: integer
          minimum: 0
          description: The kit's own value, or the store's default.
        safetyMargin:
          type: integer
          minimum: 0
          description: The kit's own value, or the store's default.
        total:
          type: integer
          minimum: 0
    KitItem:
      type: object
      required: [itemId, itemName, quantity, swappable, alternativeItemIds, unitPrice, readyDays, archived]
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
        itemName:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        swappable:
          type: boolean
          description: Cliente pode trocar.
        alternativeItemIds:
          type: array
          description: Pode trocar por. Empty unless `swappable`.
          items:
            $ref: "#/components/schemas/Uuid"
        unitPrice:
          $ref: "#/components/schemas/Money"
        readyDays:
          $ref: "#/components/schemas/ReadyDays"
        archived:
          type: boolean
          description: True when the item was archived after the kit was saved; the kit cannot be saved again until it is replaced.
    SwapDiscount:
      type: string
      enum: [keep, lose]
      description: |
        What a client's swap does to the price (ADR 0023). `keep` (the
        default): kit price − removed item + new item, both at single-item
        price. `lose`: the sum of the resulting items' single-item prices.
    KitSummary:
      type: object
      required: [id, name, itemCount, price, singleItemsTotal, totalDays, published, archived, cover, version]
      description: A row of the Kits table.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        itemCount:
          type: integer
          minimum: 1
        price:
          $ref: "#/components/schemas/Money"
        singleItemsTotal:
          $ref: "#/components/schemas/Money"
        totalDays:
          type: integer
          minimum: 0
        published:
          type: boolean
        archived:
          type: boolean
        cover:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. Null when an item of the kit has no cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    KitPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KitSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    Kit:
      type: object
      required:
        - id
        - name
        - description
        - price
        - singleItemsTotal
        - discount
        - swapDiscount
        - assemblyDays
        - safetyMarginDays
        - days
        - items
        - attributeValueIds
        - photos
        - published
        - archived
        - version
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Kit Scrambler CB 500X
        description:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        singleItemsTotal:
          $ref: "#/components/schemas/Money"
          description: Soma dos itens avulsos, quantities included.
        discount:
          $ref: "#/components/schemas/Money"
          description: Desconto do kit, `singleItemsTotal − price`. Negative when the kit costs more than its items.
        swapDiscount:
          $ref: "#/components/schemas/SwapDiscount"
        assemblyDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
          description: The kit's own assembly days; null uses the store's default.
        safetyMarginDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
          description: The kit's own safety margin; null uses the store's default.
        days:
          $ref: "#/components/schemas/KitDays"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KitItem"
        attributeValueIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        photos:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Photo"
        published:
          type: boolean
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        cost:
          description: Owner only; absent for every other role. The sum of the items' costs times their quantities; null when one has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        margin:
          description: Owner only; absent for every other role. Kit price minus cost; null without a cost.
          oneOf:
            - $ref: "#/components/schemas/Margin"
            - type: "null"
    KitInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, description, priceCents, swapDiscount, assemblyDays, safetyMarginDays, items, attributeValueIds, published]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        description:
          type: string
          maxLength: 2000
        priceCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
        swapDiscount:
          $ref: "#/components/schemas/SwapDiscount"
        assemblyDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
        safetyMarginDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 60
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: An item appears once; an alternative is never the item itself or archived.
          items:
            type: object
            additionalProperties: false
            required: [itemId, quantity, swappable, alternativeItemIds]
            properties:
              itemId:
                $ref: "#/components/schemas/Uuid"
              quantity:
                type: integer
                minimum: 1
                maximum: 99
              swappable:
                type: boolean
              alternativeItemIds:
                type: array
                maxItems: 50
                uniqueItems: true
                description: At least one when `swappable`; empty otherwise.
                items:
                  $ref: "#/components/schemas/Uuid"
        attributeValueIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        published:
          type: boolean
    ReplaceKitRequest:
      allOf:
        - $ref: "#/components/schemas/KitInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    SupplierPhone:
      type: string
      pattern: "^55[1-9]{2}[0-9]{8,9}$"
      description: Digits only, 55 + DDD + number, as wa.me links need it.
      example: "5511987654321"
    Supplier:
      type: object
      required: [id, name, whatsappPhone, version]
      description: A supplier of the store. Staff only; never on the store page. It carries no cost.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Couros Paulista
        whatsappPhone:
          $ref: "#/components/schemas/SupplierPhone"
        version:
          type: integer
          minimum: 1
    SupplierPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          description: Absent on the last page.
    SupplierInput:
      type: object
      description: Unknown fields are refused (`400 invalid`).
      required: [name, whatsappPhone]
      properties:
        name:
          $ref: "#/components/schemas/CatalogName"
        whatsappPhone:
          $ref: "#/components/schemas/SupplierPhone"
    ReplaceSupplierRequest:
      allOf:
        - $ref: "#/components/schemas/SupplierInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1
