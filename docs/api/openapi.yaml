  /api/v1/admin/orders/quote:
    post:
      tags: [orders]
      operationId: quoteOrder
      summary: Price and date an order without saving it.
      description: |
        Needs `order:write`; a discount, deposit percent or days other than
        the store's need `order:manage`. Answers what `POST /orders` would
        create: prices, deposit, each item's expected date and the delivery
        date, all computed by the server. With `orderId`, it quotes a change
        to that order, counting dates from its release date. Nothing is
        written, and a `terms.newAddress` is checked and used but never
        saved. `cost` and `margin` are the owner's and absent for every
        other role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
